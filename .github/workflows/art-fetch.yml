name: Fetch dungeon art (one-off)
on:
  push:
    branches: [art-fetch]
    paths: [tools/**, .github/**]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q pillow && python3 tools/fetch.py
      - name: Shrink and save to the branch
        run: |
          python3 tools/shrink.py
          cp out/found.json art/
          git config user.email noreply@anthropic.com; git config user.name "art fetch"
          git add art && git commit -qm "Fetched art" && git push -q origin art-fetch

<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-192.png">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&family=Alegreya+Sans+SC:wght@500;700&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0}
[hidden]{display:none!important}

/* Obsidian: near-black by default, light on request. Values come from opendesigner/build/css/tokens.css. */
:root{
  /* Colours from the guild tabard (Nov 2026): a crimson field, a gingerbread man and bright green trim. Neutrals lean red-brown. */
  --sunken:#0f0a09;--base:#161010;--raised:#1f1716;--overlay:#281e1d;--subtle:#312625;--sep:#312625;--b-sub:#3c2f2e;--b-def:#4a3a39;--field-b:#8b7b79;
  --text:#efe6e2;--sec:#bfaea9;--ter:#a6948e;--accent:#a50d2c;--on-accent:#fff3f3;--accent-text:#e0a862;--accent-hover:#c01836;--link-hover:#f0c58c;--accent-subtle:#301416;--accent-b:#8a1f2c;--focus:#e0a862;
  --trim:#2f9a46;--trim-deep:#1d5a2a;--wine:#a50d2c;--wine-text:#ef8a96;
  --info-subtle:#1a2934;--info-text:#5fb4ec;--danger:#ec958b;--bar:#8b7b79;--scrim:rgb(15 10 9 / .72);
  --q0:#9d9d9d;--q1:#efe6e2;--q2:#1eff00;--q3:#3b9cff;--q4:#b968f5;--q5:#ff8000;--q6:#e6cc80;
  --gold:#d4a24c;--lvl:#e6bc77;--silver:#c7c7c7;--copper:#b8733d;
  --display:"Alegreya Sans SC",Figtree,sans-serif;
  --body:Figtree,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --sunken:#f5efe8;--base:#fbf7f2;--raised:#ffffff;--overlay:#ffffff;--subtle:#f0e8e0;--sep:#e8ded4;--b-sub:#ddd1c6;--b-def:#d2c4b8;--field-b:#8c7b70;
  --text:#2a1d1a;--sec:#5f514c;--ter:#6f605a;--accent:#9a0a26;--on-accent:#ffffff;--accent-text:#7a4a1c;--accent-hover:#7a061d;--link-hover:#5c3712;--accent-subtle:#f8e4e6;--accent-b:#d08a94;--focus:#9a0a26;
  --trim:#23803a;--trim-deep:#1d6a30;--wine:#9a0a26;--wine-text:#9a0a26;
  --info-subtle:#dceefb;--info-text:#005c8a;--danger:#933a34;--bar:#8c7b70;--scrim:rgb(42 29 26 / .45);
  --q0:#6b6b6b;--q1:#262222;--q2:#2a7d12;--q3:#0059b3;--q4:#8a2bc9;--q5:#b35600;--q6:#8a6d1f;--lvl:#7a5f17;
  color-scheme:light;
}
body{background:var(--base);color:var(--text);font-family:var(--body);font-size:.875rem;line-height:1.25rem;font-variant-numeric:tabular-nums;min-height:100vh}
a{color:var(--accent-text)}a:hover{color:var(--link-hover)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:75rem;margin:0 auto;padding-left:max(1.5rem,env(safe-area-inset-left,0px));padding-right:max(1.5rem,env(safe-area-inset-right,0px))}
@media (max-width:600px){.wrap{padding-left:max(1rem,env(safe-area-inset-left,0px));padding-right:max(1rem,env(safe-area-inset-right,0px))}}

/* Header */
header.top{background:var(--sunken);border-bottom:3px solid var(--trim);box-shadow:inset 0 -1px 0 var(--trim-deep);padding-top:env(safe-area-inset-top,0px)}
header.top .wrap{padding-block:.75rem;display:flex;flex-wrap:wrap;gap:.5rem 1.25rem;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:.75rem;text-decoration:none}.brand-logo{width:2.5rem;height:2.5rem;flex:none;filter:drop-shadow(0 1px 2px rgb(0 0 0/.4))}
.brand b{font-family:var(--display);font-weight:700;font-size:1.5rem;line-height:2rem;color:var(--accent-text)}
.brand span{font-size:.75rem;color:var(--ter)}
nav.main{display:flex;flex-wrap:wrap;gap:.25rem;font-weight:600}
nav.main a{color:var(--sec);text-decoration:none;padding:.625rem .75rem;border-radius:6px}
nav.main a:hover{color:var(--text)}
nav.main a[aria-current="page"]{color:var(--text);background:var(--accent-subtle);box-shadow:inset 0 -2px 0 var(--accent)}
.hdr-tools{display:flex;align-items:center;gap:.375rem}
.hdr-tools .btn{height:2rem;padding:0 .625rem;font-size:.8125rem}
@media (max-width:1320px){.brand span{display:none}}
@media (max-width:1000px){
  header.top .wrap{padding-bottom:0}
  nav.main{order:3;width:100%;flex-wrap:nowrap;overflow-x:auto;margin:0 -.75rem;padding:0 .75rem .5rem;scrollbar-width:none}
  nav.main a{white-space:nowrap}
}

main{padding-block:2rem 4rem;display:flex;flex-direction:column;gap:1.5rem}
h1{margin:0;font-family:var(--display);font-weight:700;font-size:2.1875rem;line-height:2.5rem}
h2{margin:0;font-family:var(--display);font-weight:700;font-size:1.25rem;line-height:1.75rem}
h2.big{font-size:1.5rem;line-height:2rem}
h3{margin:0;font-weight:700;font-size:1.0625rem;line-height:1.5rem}
p{margin:0}
.sub{color:var(--sec)}
.ter{color:var(--ter)}
.small{font-size:.75rem;line-height:1rem}
.page-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:1rem}
.page-head>div:first-child{display:flex;flex-direction:column;gap:.25rem}
.row{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
.spread{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:.75rem}

/* Buttons and fields */
.btn{font:inherit;font-weight:600;height:2.5rem;padding:0 1rem;display:inline-flex;align-items:center;justify-content:center;gap:.5rem;border-radius:6px;cursor:pointer;background:transparent;color:var(--text);border:1px solid var(--b-def);text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--subtle);color:var(--text)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover);color:var(--on-accent)}
.btn.quiet{color:var(--sec);border-color:var(--b-sub);padding:0 .75rem}
.btn.sm{height:2rem;padding:0 .75rem}
.btn.danger{border:0;color:var(--danger);padding:0 .75rem}
.btn.ghost{border-color:transparent;color:var(--sec)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn[aria-pressed="true"]{background:var(--accent-subtle);border-color:var(--accent-b);color:var(--accent-text)}
input,select,textarea{font:inherit;font-size:1rem;height:2.5rem;padding:0 .75rem;background:var(--base);color:var(--text);border:1px solid var(--field-b);border-radius:6px;min-width:0}
textarea{height:auto;padding:.5rem .75rem;resize:vertical;width:100%}
input[type=checkbox]{width:1.125rem;height:1.125rem;accent-color:var(--accent);margin:0;flex:none}
label.f{display:flex;flex-direction:column;gap:.25rem;color:var(--sec);min-width:0}
label.f.tiny{font-size:.75rem;line-height:1rem;color:var(--ter)}
label.f.tiny input,label.f.tiny select{font-size:.875rem}
label.check{display:flex;align-items:center;gap:.5rem;min-height:2.5rem;color:var(--sec);cursor:pointer}
.field-err{color:var(--danger);font-size:.75rem;line-height:1rem}
[aria-invalid="true"]{border-color:var(--danger)!important}
.seg{display:flex;width:fit-content;max-width:100%;gap:.25rem;padding:.25rem;background:var(--sunken);border:1px solid var(--sep);border-radius:8px;flex-wrap:wrap}
.seg button{font:inherit;font-weight:600;height:2rem;padding:0 .75rem;border:0;border-radius:6px;cursor:pointer;background:transparent;color:var(--sec)}
.seg button[aria-pressed="true"]{background:var(--raised);color:var(--text)}
.seg button span{font-weight:400;color:var(--ter)}

/* Surfaces */
.card{background:var(--raised);border:1px solid var(--sep);border-radius:8px;padding:1rem 1.25rem;display:flex;flex-direction:column;gap:.5rem;min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,21.25rem),1fr));gap:1rem}
.grid.sm{grid-template-columns:repeat(auto-fill,minmax(min(100%,16.25rem),1fr))}
.tag{display:inline-block;font-size:.75rem;line-height:1rem;color:var(--sec);background:var(--subtle);border-radius:4px;padding:1px .375rem;white-space:nowrap}
.tag.info{color:var(--info-text);background:var(--info-subtle)}
.tag.gold{color:var(--accent-text);background:var(--accent-subtle)}
.dot{display:inline-block;width:.625rem;height:.625rem;border-radius:50%;flex:none}
/* Class icons, ringed in the class colour */
.cls-ic{display:inline-block;width:1.125rem;height:1.125rem;border-radius:4px;flex:none;vertical-align:middle;object-fit:cover;box-shadow:0 0 0 1px var(--cc,transparent);background:var(--sunken)}
.chip .cls-ic{width:1rem;height:1rem}
.list-row{display:flex;align-items:center;gap:.75rem;min-height:2.75rem;border-top:1px solid var(--sep)}
.list-row:first-child{border-top:0}
.empty{color:var(--ter);padding:.5rem 0}
.note{padding:.625rem .875rem;border:1px solid var(--b-sub);background:var(--sunken);border-radius:8px;color:var(--sec)}
.note.warn{border-color:var(--accent-b);color:var(--text)}
.linkish{font:inherit;font-weight:600;background:none;border:0;padding:0;color:var(--text);cursor:pointer;text-align:left;text-decoration:none}
a.linkish:hover,button.linkish:hover{color:var(--accent-text)}

/* Roster */
.roster-layout{display:grid;grid-template-columns:minmax(0,1fr) 20rem;gap:1.5rem;align-items:start}
.rl-col{display:flex;flex-direction:column;gap:1rem;min-width:0}
@media (max-width:980px){.roster-layout{grid-template-columns:minmax(0,1fr);gap:1rem}.rl-col{display:contents}.rl-col>*{order:var(--o,50)}}
.tablebox{background:var(--raised);border:1px solid var(--sep);border-radius:8px;container-type:inline-size;overflow:hidden}
table{border-collapse:collapse;width:100%}
th{font-size:.75rem;line-height:1rem;font-weight:600;color:var(--ter);text-align:left;padding:.75rem 1rem;border-bottom:1px solid var(--sep);white-space:nowrap}
td{padding:.625rem 1rem;border-top:1px solid var(--sep);vertical-align:middle}
tbody tr:first-child td{border-top:0}
tr.alt td{background:var(--base)}
tr.alt td:first-child{padding-left:2rem}
td .l2{display:block;font-size:.75rem;line-height:1rem;color:var(--ter)}
@container (max-width:640px){
  table thead{display:none}
  table,tbody,tr,td{display:block}
  tbody tr{padding:.75rem 1rem;border-top:1px solid var(--sep)}
  tbody tr:first-child{border-top:0}
  tr.alt{padding-left:2rem}
  td,tr.alt td:first-child{border:0;padding:2px 0;display:flex;justify-content:space-between;gap:.75rem;background:transparent}
  tr.alt td{background:transparent}
  td::before{content:attr(data-label);color:var(--ter);font-size:.75rem;flex:none}
  td:first-child::before{content:none}
  td>*{text-align:right}
  td:first-child>*{text-align:left}
  /* The roster: two or three tight lines per person instead of a label for every value */
  .roster-t tbody tr{display:grid;grid-template-columns:minmax(0,1fr) auto 2rem;grid-template-areas:"name lv x" "prof prof x" "seen seen x" "loot loot x";gap:.25rem .75rem;padding:.625rem .5rem .625rem .875rem;align-items:center}
  .roster-t td:nth-child(6){grid-area:x;align-self:center}
  .roster-t tbody tr.r-more{display:block;padding:0}.roster-t tr.r-more>td{display:block;padding:.25rem .875rem 1rem}
  .roster-t tbody tr.r-group{display:block;padding:0}.roster-t tr.r-group>td{display:block;padding:.5rem .875rem}
  .roster-t td{display:block;padding:0;font-size:.8125rem;line-height:1.125rem}
  .roster-t td::before{content:none}
  .roster-t td>*{text-align:left}
  .roster-t td:nth-child(1){grid-area:name;font-size:.875rem;line-height:1.25rem}
  .roster-t td:nth-child(2){grid-area:lv;justify-self:end}
  .roster-t td:nth-child(3){grid-area:prof}
  .roster-t td:nth-child(4){grid-area:loot}
  .roster-t td:nth-child(5){grid-area:seen;color:var(--ter);white-space:nowrap}
  .roster-t td:nth-child(5) .ter{color:inherit}
  .roster-t .seen-l{display:none}
  .roster-t td.none{display:none}
  .roster-t tr.alt{padding-left:1.75rem}
}

/* Professions */
.pbar{display:grid;grid-template-columns:minmax(0,9em) minmax(0,1fr) 4.5em;gap:.75rem;align-items:center}
.pbar .lbl{display:flex;flex-direction:column;min-width:0}
.pbar .lbl .r{font-size:.75rem;line-height:1rem;color:var(--ter)}
.track{height:.5rem;background:var(--sunken);border:1px solid var(--sep);border-radius:4px;position:relative;overflow:hidden}
.track i{position:absolute;left:0;top:0;bottom:0;background:var(--bar)}
.track i.max{background:var(--accent)}
.track b{position:absolute;top:0;bottom:0;width:1px;background:var(--b-sub)}
.pbar .num{text-align:right;color:var(--ter);font-size:.75rem}
.pbar .num.max{color:var(--accent-text)}

/* Items and coins */
.item-plain{font-weight:600}
.item-link{font-weight:600;text-decoration:none;color:var(--accent-text);overflow-wrap:anywhere}
.item-link.q0{color:var(--q0)!important}.item-link.q1{color:var(--q1)!important}.item-link.q2{color:var(--q2)!important}.item-link.q3{color:var(--q3)!important}.item-link.q4{color:var(--q4)!important}.item-link.q5{color:var(--q5)!important}.item-link.q6,.item-link.q7{color:var(--q6)!important}

/* Profile */
.profile{display:grid;grid-template-columns:minmax(0,1fr) 22.5rem;gap:1rem;align-items:start}
.profile>section,.profile>[data-sec],.profile .col>*{min-width:0}
@media (max-width:1000px){.profile{grid-template-columns:minmax(0,1fr) 20rem}}
.profile .col{display:flex;flex-direction:column;gap:1rem;min-width:0}
@media (max-width:900px){.profile{grid-template-columns:minmax(0,1fr)}.profile .col{display:contents}.profile .col>*{order:var(--o,50)}}
.journey{display:flex;flex-direction:column}
.journey div{display:flex;justify-content:space-between;gap:.75rem;padding:.5rem 0;border-top:1px solid var(--sep)}
.journey div:first-child{border-top:0}

/* Dialog */
dialog{border:1px solid var(--b-sub);border-radius:12px;background:var(--overlay);color:var(--text);padding:0;width:min(40rem,calc(100vw - 2rem));max-height:calc(100vh - 3rem);box-shadow:0 1px 2px rgb(0 0 0 / .27),0 4px 12px rgb(0 0 0 / .23)}
dialog::backdrop{background:var(--scrim)}
dialog form{padding:1.5rem;display:flex;flex-direction:column;gap:1.25rem}
dialog fieldset{border:0;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,11.25rem),1fr));gap:.75rem 1rem}
dialog legend{font-weight:700;font-size:1.0625rem;line-height:1.5rem;padding:0 0 .5rem}
.dlg-actions{display:flex;flex-wrap:wrap;justify-content:space-between;gap:.5rem;padding-top:.5rem;border-top:1px solid var(--sep)}

/* Sign in */

/* Sync and offline notice floats in the corner so it never pushes the page around. */
.netbar{position:fixed;left:1rem;bottom:calc(1rem + env(safe-area-inset-bottom,0px));z-index:15;max-width:min(26.25rem,calc(100vw - 2rem));font-size:.8125rem;line-height:1.125rem;padding:.5rem .75rem;border-radius:8px;border:1px solid var(--accent-b);background:var(--sunken);color:var(--text);box-shadow:0 4px 12px rgb(0 0 0 / .25);pointer-events:none}
.lg-card{width:16.25rem;height:23.75rem;border-radius:16px;padding:.375rem;box-shadow:0 6px 20px rgb(0 0 0 / .35);flex:none;box-sizing:border-box;position:relative;overflow:hidden}
/* Foil cards catch the light when you point at them (bronze a little, silver more, gold most). */
.lg-card.foil::after{content:"";position:absolute;top:0;bottom:0;left:-100%;width:100%;pointer-events:none;opacity:0;background:linear-gradient(105deg,transparent 20%,var(--shine) 50%,transparent 80%);mix-blend-mode:screen}
@media (hover:hover) and (pointer:fine){.lg-card.foil:hover::after{animation:lgShine .9s cubic-bezier(.23,1,.32,1) forwards}}
@keyframes lgShine{from{opacity:1;transform:translateX(0)}to{opacity:1;transform:translateX(200%)}}
@media (prefers-reduced-motion:reduce){.lg-card.foil:hover::after{animation:none}}
.lg-card-in{height:100%;border-radius:11px;background:#0f0a09;overflow:hidden;display:flex;flex-direction:column;position:relative;color:#efe6e2}
.lg-hd{display:flex;justify-content:space-between;align-items:baseline;gap:.5rem;padding:.5625rem .75rem .375rem}
.lg-hd b{font-family:var(--display);font-weight:700;font-size:1.1875rem;line-height:1.375rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.lg-hp{font-weight:700;font-size:.9375rem;line-height:1.25rem;color:#ff7a6b;white-space:nowrap}.lg-hp small{font-size:.625rem;font-weight:700;margin-right:2px}
.lg-art{height:9.375rem;margin:0 .625rem;border-radius:96px 96px 8px 8px;position:relative;overflow:hidden;flex:none;border:2px solid rgb(255 255 255 / .14);background:#0f0a09 center/cover}
.lg-art img.r{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 40%;transform:scale(1.35)}
.lg-face{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:4.75rem;height:4.75rem;border-radius:50%;background:#0f0a09;border:3px solid;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:1.75rem;overflow:hidden}
.lg-face img{width:100%;height:100%;object-fit:cover}
.lg-type{flex:none;margin:.5rem .625rem 0;padding:.1875rem .5rem;border-radius:4px;font-size:.6875rem;line-height:1rem;font-weight:700;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lg-stats{flex:1;padding:.375rem .75rem 0;display:flex;flex-direction:column;gap:.4375rem}
.lg-st{display:grid;grid-template-columns:1.25rem minmax(0,1fr) auto;align-items:center;gap:2px .5rem}
.lg-st i{width:1.25rem;height:1.25rem;border-radius:50%;display:flex;align-items:center;justify-content:center;font:700 .5625rem/1 var(--body);color:#fff;font-style:normal;grid-row:span 2}
.lg-st span{font-size:.8125rem;line-height:1rem;font-weight:600;color:#d9cdbb;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lg-st b{font-size:.9375rem;line-height:1rem;font-weight:700;text-align:right}
.lg-st u{grid-column:2/4;display:block;height:.25rem;border-radius:2px;background:rgb(255 255 255 / .1);position:relative;overflow:hidden;text-decoration:none}
.lg-st u s{position:absolute;inset:0 auto 0 0;border-radius:2px;text-decoration:none}
.lg-flav{margin:0;padding:2px .75rem 0;font-size:.6875rem;line-height:.875rem;font-style:italic;color:#bfaea9;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lg-ft{display:flex;justify-content:space-between;align-items:center;gap:.5rem;padding:.375rem .75rem .625rem;font-size:.6875rem;line-height:.875rem;color:#a6948e}
.lg-mini{display:flex;gap:.625rem;min-width:0}
.lg-mini span{display:flex;flex-direction:column;line-height:.75rem}
.lg-mini small{font-size:.5rem;line-height:.625rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#8b7b79}
.lg-mini b{font-size:.75rem;line-height:.875rem;font-weight:700;color:#efe6e2}
.lg-ft span{font-weight:700;white-space:nowrap}
@keyframes lgHolo{0%{background-position:0% 50%}100%{background-position:200% 50%}}
.lg-holo{position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 20%,rgb(255 255 255 / .22) 35%,rgb(255 214 140 / .28) 45%,rgb(160 220 255 / .22) 55%,transparent 70%);background-size:200% 100%;animation:lgHolo 4s linear infinite;mix-blend-mode:screen}
@media (prefers-reduced-motion:reduce){.lg-holo{animation:none}}

.prof-cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem 2rem;align-items:start}
.prof-cols>div:only-child{grid-column:1/-1}
@media (max-width:860px){.prof-cols{grid-template-columns:minmax(0,1fr)}}
@media (max-width:560px){.ch-hero{gap:.75rem;align-items:flex-start}.ch-av{width:3.5rem;height:3.5rem;font-size:1.125rem}}
/* Dungeons / Raids switch, and the Raids page */
.dg-tabs a{display:inline-flex;align-items:center;font-weight:600;height:2rem;padding:0 .875rem;border-radius:6px;color:var(--sec);text-decoration:none}
.dg-tabs a:hover{color:var(--text)}
.dg-tabs a[aria-current="page"]{background:var(--raised);color:var(--text)}
.rd-t tr.rd-away td{color:var(--ter)}
.rd-way{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,17rem),1fr));gap:.75rem 1.5rem}
.rd-way li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.25rem .75rem;align-items:baseline}
.rd-way .track{grid-column:1/-1}
/* Calmer sync lines and card back touches */
.sync-all{display:flex;flex-direction:column;gap:.375rem;margin-top:.375rem}
.sync-more{font-weight:500;color:var(--ter);text-decoration:underline;text-underline-offset:2px;min-height:1.75rem;padding:0 .25rem}
.sync-more:hover{color:var(--text)}
.mk-more summary{cursor:pointer;color:var(--sec);font-weight:600}
.lg-tab{line-height:1.625rem;font-size:.6875rem}
.lg-lv.lg-lv-b{position:static;flex:none;width:1.875rem;height:1.875rem;font-size:.8125rem;align-self:center}
/* Signature move on the card */
.lg-art.has-move .lg-hd{bottom:.8125rem}
.lg-move{position:absolute;left:.75rem;right:.75rem;bottom:.25rem;z-index:1;font-size:.625rem;line-height:.875rem;font-weight:600;color:#e9b877;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 3px rgb(0 0 0 / .9)}
/* An opened roster row: the card beside the details */
.r-open{display:flex;gap:2rem;align-items:center;padding:.5rem 0}
.r-open .r-detail{flex:1;min-width:0;grid-template-columns:repeat(2,minmax(0,1fr));align-self:flex-start}
.r-card{flex:none;order:2}
.r-card .lg-flip{zoom:.9}
@media (max-width:760px){.r-open{flex-direction:column;align-items:stretch;gap:1rem}.r-card{align-self:center}.r-card .lg-flip{zoom:1}.r-open .r-detail{grid-template-columns:minmax(0,1fr);align-self:stretch}}
/* Reigns, frame swatches, title news and roster status badges */
.hot-fr{flex:none;width:1.125rem;height:1.5rem;border-radius:3px;box-shadow:inset 0 0 0 2px rgb(15 10 9 / .55)}
.title-wk{margin-left:.375rem;font-size:.6875rem;font-weight:700}
.feed-title{color:var(--accent-text)}
.tag.st-fresh{color:var(--trim);border-color:color-mix(in srgb,var(--trim) 45%,transparent)}
.tag.st-tear{color:var(--accent-text);border-color:color-mix(in srgb,var(--accent-text) 45%,transparent)}
.tag.st-mia{color:var(--ter)}
/* Streak flame, guild rank and PvP pennants on the card, and the title chooser */
.flame{display:inline-flex;align-items:center;gap:.125rem;font-size:.75rem;line-height:1.25rem;font-weight:700;color:#e2752a;font-variant-numeric:tabular-nums;white-space:nowrap}
:root[data-theme="light"] .flame{color:#a8480c}
.flame>span:first-child{display:inline-flex;width:.875rem;height:.875rem}
.flame svg{width:100%;height:100%}
.r-seen{display:inline-flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.flame.big{font-size:1rem;margin-left:.625rem;vertical-align:middle}
.flame.big>span:first-child{width:1.125rem;height:1.125rem}
.lg-pvp{position:absolute;top:3.125rem;right:.5rem;width:2.25rem;z-index:1;display:flex;justify-content:center;filter:drop-shadow(0 1px 2px rgb(0 0 0 / .85))}
.lg-rank{position:absolute;left:.75rem;bottom:1.875rem;z-index:1;display:flex;align-items:center;gap:.3125rem;font:700 .6875rem/1 var(--display);letter-spacing:.1em;text-transform:uppercase;color:#f6d77a;text-shadow:0 1px 3px rgb(0 0 0 / .9)}
.lg-rank>span{display:inline-flex;width:.8125rem;height:.8125rem}.lg-rank svg{width:100%;height:100%}
.lg-art.has-move .lg-rank{bottom:2.4375rem}
.lg-art.is-gm .lg-hd b{color:#f6d77a}
.title-pick{display:flex;flex-direction:column;align-items:center;gap:.5rem;width:100%}
.tp-row{display:flex;flex-wrap:wrap;justify-content:center;gap:.625rem}
.tp-sw{width:3.5rem;height:4.5rem;box-sizing:border-box;border:0;border-radius:8px;padding:0 0 .375rem;display:flex;align-items:flex-end;justify-content:center;cursor:pointer;box-shadow:inset 0 0 0 2px rgb(15 10 9 / .45)}
.tp-sw span{font:700 .5625rem/1 var(--display);letter-spacing:.06em;text-transform:uppercase;color:#fff;text-shadow:0 1px 2px rgb(0 0 0 / .9);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 .125rem}
.tp-sw[aria-pressed="true"]{outline:3px solid var(--accent-text);outline-offset:2px}
.tp-sw:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
.tp-sw:hover{filter:brightness(1.12)}
/* Card back: nothing may run past the card */
.lg-back .lg-card-in{overflow:hidden}
.lg-clip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lg-back .lg-br span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
/* Guild scribe: when the guild plays, raid nights, recipes known */
.wwp{display:grid;grid-template-columns:2.25rem repeat(24,minmax(0,1fr));gap:2px;align-items:center}
.wwp-h{font-size:.625rem;line-height:.875rem;color:var(--ter);white-space:nowrap;overflow:visible}
.wwp-d{font-size:.75rem;color:var(--sec);font-weight:600}
.wwp-c{display:block;height:1.125rem;border-radius:2px;background:color-mix(in srgb,var(--accent) calc(var(--a,0)*100%),var(--subtle))}
.wwp-c.none{background:transparent;box-shadow:inset 0 0 0 1px var(--sep)}
.rn{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.625rem}
.rn li{display:grid;grid-template-columns:minmax(0,12rem) minmax(0,1fr);gap:.5rem 1rem;align-items:start;padding-top:.625rem;border-top:1px solid var(--sep)}
.rn li:first-child{border-top:0;padding-top:0}
.rn-when{display:flex;flex-direction:column}
.rn-who{display:flex;flex-wrap:wrap;gap:.375rem}
@media (max-width:640px){.rn li{grid-template-columns:minmax(0,1fr)}.wwp{grid-template-columns:1.75rem repeat(24,minmax(0,1fr));gap:1px}.wwp-c{height:.875rem}}
.rc-knows{font-size:.75rem;font-weight:700;color:var(--trim)}
:root[data-theme="light"] .rc-knows{color:#1d6b30}
</style>

  walk(doc.body);return doc.body.innerHTML}

/* ---------- Ding ---------- */
// A quick celebration when one of your characters has gone up a level since you last opened the site on this device.

    if(was&&lv>was&&(!best||lv-was>best.lv-best.from))best={m,lv,from:was};
    if(lv!==was){seen[m.id]=lv;changed=true}}
  if(changed)try{localStorage.setItem("lg-lv",JSON.stringify(seen))}catch(e){}
  if(best)showDing(best)}
function showDing({m,lv,from}){
  const tier=tierOf(lv)[1],tierUp=tier!==tierOf(from)[1]?tier:"",next=TIERS.slice().reverse().find(x=>x[0]>lv);
  const firstN=MILESTONES.filter(n=>n>from&&n<=lv).reverse().find(n=>{const f=S.firsts&&S.firsts["lv"+n];return f&&f.id===m.id});
  const lines=[lv-from>1?`Up ${lv-from} levels since you last looked.`:"",firstN?`First in the guild to level ${firstN}.`:"",tierUp?`Your card is ${tierUp.toLowerCase()} now.`:""].filter(Boolean);
  if(!lines.length)lines.push(lv>=60?"Max level.":next?`${next[0]-lv} levels to a ${next[1].toLowerCase()} card.`:"");

// Celebrations show one at a time: each waits for the one before to close.

    h("div",{class:"uf-por","aria-hidden":"true"},h("span",{class:"uf-face"},h("img",{src:"icon.svg",alt:""})),h("b",{class:"uf-lv"},badge)),
    h("div",{class:"uf-body"},h("div",{class:"uf-name"},"Blood and Tears"),h("div",{class:"uf-xp","aria-hidden":"true"},h("i")),h("div",{class:"uf-t"},title),h("div",{class:"uf-s"},sub)),

function route(){const p=(location.hash||"#roster").slice(1).split("/");if(p[0]==="char")return{page:"char",coll:p[1],id:p[2]};if(p[0]==="history")return{page:"history"};if(["duel","draft","trumps","guess"].includes(p[0]))return{page:"cards"};const pg=p[0]==="events"||p[0]==="trades"?"lfg":p[0];return{page:pg==="raids"||PAGES.some(x=>x[0]===pg)?pg:"roster"}}

  if(!configured){app.replaceChildren(h("main",{class:"wrap"},h("div",{class:"note warn"},"This copy isn't connected to Firebase yet. Paste your project's config into firebase-config.js.")));return}
  if(S.authError){app.replaceChildren(h("main",{class:"wrap",style:"padding-top:3rem"},h("div",{class:"note warn"},S.authError)));return}
  if(!S.user){app.replaceChildren(h("main",{class:"wrap",style:"padding-top:3rem"},h("p",{class:"ter"},"Loading…")));return}

  const body=r.page==="char"?viewChar(r.coll,r.id):r.page==="history"?viewHistory():views[r.page]();

  const net=!navigator.onLine?(S.pending?"You're offline. Your changes are saved on this device and will sync when you reconnect.":"You're offline. Showing the last copy saved on this device."):S.slowSync?"Still syncing your changes…":"";
  app.replaceChildren(...[header(r.page==="char"?"":r.page==="history"?"roster":r.page==="raids"?"lfg":r.page),
    net?h("div",{class:"netbar",role:"status"},net):null,winterVeil(),
    h("main",{class:"wrap"},
    S.error?h("div",{class:"note warn"},S.error):null,
    S.saveErr?h("div",{class:"note warn spread",role:"alert"},h("span",{},S.saveErr),h("button",{class:"btn sm",onclick:()=>{S.saveErr="";render()}},"OK")):null,
    !S.loaded&&!S.error?h("div",{class:"note"},"Loading the roster…"):null,
    body),
    h("footer",{class:"site-foot wrap"},h("span",{},"Blood and Tears · a guild site, made by guildies"),h("button",{type:"button",class:"foot-link",onclick:openPrivacy},"Privacy and opting out"))].filter(Boolean));
  for(const[id,v]of Object.entries(typed)){const el=document.getElementById(id);if(!el||el.closest("dialog"))continue;el.value=v}

let rq=0;const schedule=()=>{if(rq)return;rq=requestAnimationFrame(()=>{rq=0;if(!$("#dlg").open)render();else schedule._pending=true})};

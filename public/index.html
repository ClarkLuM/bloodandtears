<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-192.png">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&family=Alegreya+Sans+SC:wght@500;700&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0}
[hidden]{display:none!important}

/* Obsidian: near-black by default, light on request. Values come from opendesigner/build/css/tokens.css. */
:root{
  --sunken:#0f0e0e;--base:#171515;--raised:#201d1d;--overlay:#292525;--subtle:#332e2e;--sep:#332e2e;--b-sub:#3d3737;--b-def:#4a4242;--field-b:#8a7f7f;
  --text:#ece7e7;--sec:#b7abab;--ter:#a29595;--accent:#b8282a;--on-accent:#fff6f2;--accent-text:#f07a6e;--accent-hover:#cf3a35;--link-hover:#f7a097;--accent-subtle:#33181a;--accent-b:#8c2f2e;--focus:#f07a6e;
  --info-subtle:#1a2934;--info-text:#5fb4ec;--danger:#ec958b;--bar:#8a7f7f;--scrim:rgb(15 14 14 / .72);
  --q0:#9d9d9d;--q1:#ece7e7;--q2:#1eff00;--q3:#3b9cff;--q4:#b968f5;--q5:#ff8000;--q6:#e6cc80;
  --gold:#d4a24c;--lvl:#e6bc77;--silver:#c7c7c7;--copper:#b8733d;
  --display:"Alegreya Sans SC",Figtree,sans-serif;
  --body:Figtree,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --sunken:#f6f4f4;--base:#fcfbfb;--raised:#ffffff;--overlay:#ffffff;--subtle:#efecec;--sep:#e7e3e3;--b-sub:#dcd6d6;--b-def:#d3cccc;--field-b:#8c8282;
  --text:#262222;--sec:#5e5454;--ter:#6e6363;--accent:#b8282a;--on-accent:#ffffff;--accent-text:#a32420;--accent-hover:#8a1c19;--link-hover:#8a1c19;--accent-subtle:#f9e7e6;--accent-b:#cf7c76;--focus:#b8282a;
  --info-subtle:#dceefb;--info-text:#005c8a;--danger:#933a34;--bar:#8c8282;--scrim:rgb(34 30 30 / .45);
  --q0:#6b6b6b;--q1:#262222;--q2:#2a7d12;--q3:#0059b3;--q4:#8a2bc9;--q5:#b35600;--q6:#8a6d1f;--lvl:#7a5f17;
  color-scheme:light;
}
body{background:var(--base);color:var(--text);font-family:var(--body);font-size:.875rem;line-height:1.25rem;font-variant-numeric:tabular-nums;min-height:100vh}
a{color:var(--accent-text)}a:hover{color:var(--link-hover)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:75rem;margin:0 auto;padding-left:max(1.5rem,env(safe-area-inset-left,0px));padding-right:max(1.5rem,env(safe-area-inset-right,0px))}
@media (max-width:600px){.wrap{padding-left:max(1rem,env(safe-area-inset-left,0px));padding-right:max(1rem,env(safe-area-inset-right,0px))}}

/* Header */
header.top{background:var(--sunken);border-bottom:1px solid var(--sep);padding-top:env(safe-area-inset-top,0px)}
header.top .wrap{padding-block:.75rem;display:flex;flex-wrap:wrap;gap:.5rem 1.25rem;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:baseline;gap:.75rem;text-decoration:none}
.brand b{font-family:var(--display);font-weight:700;font-size:1.5rem;line-height:2rem;color:var(--accent-text)}
.brand span{font-size:.75rem;color:var(--ter)}
nav.main{display:flex;flex-wrap:wrap;gap:.25rem;font-weight:600}
nav.main a{color:var(--sec);text-decoration:none;padding:.625rem .75rem;border-radius:6px}
nav.main a:hover{color:var(--text)}
nav.main a[aria-current="page"]{color:var(--text);background:var(--subtle)}
.hdr-tools{display:flex;align-items:center;gap:.375rem}
.hdr-tools .btn{height:2rem;padding:0 .625rem;font-size:.8125rem}
@media (max-width:1320px){.brand span{display:none}}
@media (max-width:1000px){
  header.top .wrap{padding-bottom:0}
  nav.main{order:3;width:100%;flex-wrap:nowrap;overflow-x:auto;margin:0 -.75rem;padding:0 .75rem .5rem;scrollbar-width:none}
  nav.main a{white-space:nowrap}
}

main{padding-block:2rem 4rem;display:flex;flex-direction:column;gap:1.5rem}
h1{margin:0;font-family:var(--display);font-weight:700;font-size:2.1875rem;line-height:2.5rem}
h2{margin:0;font-family:var(--display);font-weight:700;font-size:1.25rem;line-height:1.75rem}
h2.big{font-size:1.5rem;line-height:2rem}
h3{margin:0;font-weight:700;font-size:1.0625rem;line-height:1.5rem}
p{margin:0}
.sub{color:var(--sec)}
.ter{color:var(--ter)}
.small{font-size:.75rem;line-height:1rem}
.page-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:1rem}
.page-head>div:first-child{display:flex;flex-direction:column;gap:.25rem}
.row{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
.spread{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:.75rem}

/* Buttons and fields */
.btn{font:inherit;font-weight:600;height:2.5rem;padding:0 1rem;display:inline-flex;align-items:center;justify-content:center;gap:.5rem;border-radius:6px;cursor:pointer;background:transparent;color:var(--text);border:1px solid var(--b-def);text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--subtle);color:var(--text)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover);color:var(--on-accent)}
.btn.quiet{color:var(--sec);border-color:var(--b-sub);padding:0 .75rem}
.btn.sm{height:2rem;padding:0 .75rem}
.btn.danger{border:0;color:var(--danger);padding:0 .75rem}
.btn.ghost{border-color:transparent;color:var(--sec)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn[aria-pressed="true"]{background:var(--accent-subtle);border-color:var(--accent-b);color:var(--accent-text)}
input,select,textarea{font:inherit;font-size:1rem;height:2.5rem;padding:0 .75rem;background:var(--base);color:var(--text);border:1px solid var(--field-b);border-radius:6px;min-width:0}
textarea{height:auto;padding:.5rem .75rem;resize:vertical;width:100%}
input[type=checkbox]{width:1.125rem;height:1.125rem;accent-color:var(--accent);margin:0;flex:none}
label.f{display:flex;flex-direction:column;gap:.25rem;color:var(--sec);min-width:0}
label.f.tiny{font-size:.75rem;line-height:1rem;color:var(--ter)}
label.f.tiny input,label.f.tiny select{font-size:.875rem}
label.check{display:flex;align-items:center;gap:.5rem;min-height:2.5rem;color:var(--sec);cursor:pointer}
.field-err{color:var(--danger);font-size:.75rem;line-height:1rem}
[aria-invalid="true"]{border-color:var(--danger)!important}
.seg{display:flex;width:fit-content;max-width:100%;gap:.25rem;padding:.25rem;background:var(--sunken);border:1px solid var(--sep);border-radius:8px;flex-wrap:wrap}
.seg button{font:inherit;font-weight:600;height:2rem;padding:0 .75rem;border:0;border-radius:6px;cursor:pointer;background:transparent;color:var(--sec)}
.seg button[aria-pressed="true"]{background:var(--raised);color:var(--text)}
.seg button span{font-weight:400;color:var(--ter)}

/* Surfaces */
.card{background:var(--raised);border:1px solid var(--sep);border-radius:8px;padding:1rem 1.25rem;display:flex;flex-direction:column;gap:.5rem;min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,21.25rem),1fr));gap:1rem}
.grid.sm{grid-template-columns:repeat(auto-fill,minmax(min(100%,16.25rem),1fr))}
.tag{display:inline-block;font-size:.75rem;line-height:1rem;color:var(--sec);background:var(--subtle);border-radius:4px;padding:1px .375rem;white-space:nowrap}
.tag.info{color:var(--info-text);background:var(--info-subtle)}
.tag.gold{color:var(--accent-text);background:var(--accent-subtle)}
.dot{display:inline-block;width:.625rem;height:.625rem;border-radius:50%;flex:none}
/* Class icons, ringed in the class colour */
.cls-ic{display:inline-block;width:1.125rem;height:1.125rem;border-radius:4px;flex:none;vertical-align:middle;object-fit:cover;box-shadow:0 0 0 1px var(--cc,transparent);background:var(--sunken)}
.chip .cls-ic{width:1rem;height:1rem}
.list-row{display:flex;align-items:center;gap:.75rem;min-height:2.75rem;border-top:1px solid var(--sep)}
.list-row:first-child{border-top:0}
.empty{color:var(--ter);padding:.5rem 0}
.note{padding:.625rem .875rem;border:1px solid var(--b-sub);background:var(--sunken);border-radius:8px;color:var(--sec)}
.note.warn{border-color:var(--accent-b);color:var(--text)}
.linkish{font:inherit;font-weight:600;background:none;border:0;padding:0;color:var(--text);cursor:pointer;text-align:left;text-decoration:none}
a.linkish:hover,button.linkish:hover{color:var(--accent-text)}

/* Roster */
.roster-layout{display:grid;grid-template-columns:minmax(0,1fr) 20rem;gap:1.5rem;align-items:start}
.rl-col{display:flex;flex-direction:column;gap:1rem;min-width:0}
@media (max-width:980px){.roster-layout{grid-template-columns:minmax(0,1fr);gap:1rem}.rl-col{display:contents}.rl-col>*{order:var(--o,50)}}
.tablebox{background:var(--raised);border:1px solid var(--sep);border-radius:8px;container-type:inline-size;overflow:hidden}
table{border-collapse:collapse;width:100%}
th{font-size:.75rem;line-height:1rem;font-weight:600;color:var(--ter);text-align:left;padding:.75rem 1rem;border-bottom:1px solid var(--sep);white-space:nowrap}
td{padding:.625rem 1rem;border-top:1px solid var(--sep);vertical-align:middle}
tbody tr:first-child td{border-top:0}
tr.alt td{background:var(--base)}
tr.alt td:first-child{padding-left:2rem}
td .l2{display:block;font-size:.75rem;line-height:1rem;color:var(--ter)}
@container (max-width:640px){
  table thead{display:none}
  table,tbody,tr,td{display:block}
  tbody tr{padding:.75rem 1rem;border-top:1px solid var(--sep)}
  tbody tr:first-child{border-top:0}
  tr.alt{padding-left:2rem}
  td,tr.alt td:first-child{border:0;padding:2px 0;display:flex;justify-content:space-between;gap:.75rem;background:transparent}
  tr.alt td{background:transparent}
  td::before{content:attr(data-label);color:var(--ter);font-size:.75rem;flex:none}
  td:first-child::before{content:none}
  td>*{text-align:right}
  td:first-child>*{text-align:left}
  /* The roster: two or three tight lines per person instead of a label for every value */
  .roster-t tbody tr{display:grid;grid-template-columns:minmax(0,1fr) fit-content(50%) 2rem;grid-template-areas:"name rl x" "cls seen x" "prof loot x";gap:2px .75rem;padding:.625rem .5rem .625rem .875rem}
  .roster-t td:nth-child(7){grid-area:x;align-self:center}
  .roster-t tbody tr.r-more{display:block;padding:0}.roster-t tr.r-more>td{display:block;padding:.25rem .875rem 1rem}
  .roster-t tbody tr.r-group{display:block;padding:0}.roster-t tr.r-group>td{display:block;padding:.5rem .875rem}
  .roster-t td{display:block;padding:0;font-size:.8125rem;line-height:1.125rem}
  .roster-t td::before{content:none}
  .roster-t td>*{text-align:left}
  .roster-t td:nth-child(1){grid-area:name;font-size:.875rem;line-height:1.25rem}
  .roster-t td:nth-child(2){grid-area:cls;color:var(--sec)}
  .roster-t td:nth-child(2) .l2{display:inline;font-size:.8125rem;color:var(--ter)}
  .roster-t td:nth-child(2) .l2::before{content:" · "}
  .roster-t td:nth-child(3){grid-area:rl;text-align:right;font-weight:600}
  .roster-t td:nth-child(4){grid-area:prof;color:var(--ter)}
  .roster-t td:nth-child(5){grid-area:loot;text-align:right}
  .roster-t td:nth-child(6){grid-area:seen;text-align:right;color:var(--ter);white-space:nowrap}
  .roster-t td:nth-child(6) .ter{color:inherit}
  .roster-t .seen-l{display:none}
  .roster-t td.none{display:none}
  .roster-t tr.alt{padding-left:1.75rem}
}

/* Professions */
.pbar{display:grid;grid-template-columns:minmax(0,9em) minmax(0,1fr) 4.5em;gap:.75rem;align-items:center}
.pbar .lbl{display:flex;flex-direction:column;min-width:0}
.pbar .lbl .r{font-size:.75rem;line-height:1rem;color:var(--ter)}
.track{height:.5rem;background:var(--sunken);border:1px solid var(--sep);border-radius:4px;position:relative;overflow:hidden}
.track i{position:absolute;left:0;top:0;bottom:0;background:var(--bar)}
.track i.max{background:var(--accent)}
.track b{position:absolute;top:0;bottom:0;width:1px;background:var(--b-sub)}
.pbar .num{text-align:right;color:var(--ter);font-size:.75rem}
.pbar .num.max{color:var(--accent-text)}

/* Items and coins */
.item-plain{font-weight:600}
.item-link{font-weight:600;text-decoration:none;color:var(--accent-text);overflow-wrap:anywhere}
.item-link.q0{color:var(--q0)!important}.item-link.q1{color:var(--q1)!important}.item-link.q2{color:var(--q2)!important}.item-link.q3{color:var(--q3)!important}.item-link.q4{color:var(--q4)!important}.item-link.q5{color:var(--q5)!important}.item-link.q6,.item-link.q7{color:var(--q6)!important}

/* Profile */
.profile{display:grid;grid-template-columns:minmax(0,1fr) 22.5rem;gap:1rem;align-items:start}
.profile>section,.profile>[data-sec],.profile .col>*{min-width:0}
@media (max-width:1000px){.profile{grid-template-columns:minmax(0,1fr) 20rem}}
.profile .col{display:flex;flex-direction:column;gap:1rem;min-width:0}
@media (max-width:900px){.profile{grid-template-columns:minmax(0,1fr)}.profile .col{display:contents}.profile .col>*{order:var(--o,50)}}
.journey{display:flex;flex-direction:column}
.journey div{display:flex;justify-content:space-between;gap:.75rem;padding:.5rem 0;border-top:1px solid var(--sep)}
.journey div:first-child{border-top:0}

/* Dialog */
dialog{border:1px solid var(--b-sub);border-radius:12px;background:var(--overlay);color:var(--text);padding:0;width:min(40rem,calc(100vw - 2rem));max-height:calc(100vh - 3rem);box-shadow:0 1px 2px rgb(0 0 0 / .27),0 4px 12px rgb(0 0 0 / .23)}
dialog::backdrop{background:var(--scrim)}
dialog form{padding:1.5rem;display:flex;flex-direction:column;gap:1.25rem}
dialog fieldset{border:0;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,11.25rem),1fr));gap:.75rem 1rem}
dialog legend{font-weight:700;font-size:1.0625rem;line-height:1.5rem;padding:0 0 .5rem}
.dlg-actions{display:flex;flex-wrap:wrap;justify-content:space-between;gap:.5rem;padding-top:.5rem;border-top:1px solid var(--sep)}

/* Sign in */

/* Sync and offline notice floats in the corner so it never pushes the page around. */
.netbar{position:fixed;left:1rem;bottom:calc(1rem + env(safe-area-inset-bottom,0px));z-index:15;max-width:min(26.25rem,calc(100vw - 2rem));font-size:.8125rem;line-height:1.125rem;padding:.5rem .75rem;border-radius:8px;border:1px solid var(--accent-b);background:var(--sunken);color:var(--text);box-shadow:0 4px 12px rgb(0 0 0 / .25);pointer-events:none}
.lg-card{width:16.25rem;height:23.75rem;border-radius:16px;padding:.375rem;box-shadow:0 6px 20px rgb(0 0 0 / .35);flex:none;box-sizing:border-box;position:relative;overflow:hidden}
/* Foil cards catch the light when you point at them (bronze a little, silver more, gold most). */
.lg-card.foil::after{content:"";position:absolute;top:0;bottom:0;left:-100%;width:100%;pointer-events:none;opacity:0;background:linear-gradient(105deg,transparent 20%,var(--shine) 50%,transparent 80%);mix-blend-mode:screen}
@media (hover:hover) and (pointer:fine){.lg-card.foil:hover::after{animation:lgShine .9s cubic-bezier(.23,1,.32,1) forwards}}
@keyframes lgShine{from{opacity:1;transform:translateX(0)}to{opacity:1;transform:translateX(200%)}}
@media (prefers-reduced-motion:reduce){.lg-card.foil:hover::after{animation:none}}
.lg-card-in{height:100%;border-radius:11px;background:#0f0e0e;overflow:hidden;display:flex;flex-direction:column;position:relative;color:#ece7e7}
.lg-hd{display:flex;justify-content:space-between;align-items:baseline;gap:.5rem;padding:.5625rem .75rem .375rem}
.lg-hd b{font-family:var(--display);font-weight:700;font-size:1.1875rem;line-height:1.375rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.lg-hp{font-weight:700;font-size:.9375rem;line-height:1.25rem;color:#ff7a6b;white-space:nowrap}.lg-hp small{font-size:.625rem;font-weight:700;margin-right:2px}
.lg-art{height:9.375rem;margin:0 .625rem;border-radius:96px 96px 8px 8px;position:relative;overflow:hidden;flex:none;border:2px solid rgb(255 255 255 / .14);background:#0f0e0e center/cover}
.lg-art img.r{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 40%;transform:scale(1.35)}
.lg-face{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:4.75rem;height:4.75rem;border-radius:50%;background:#0f0e0e;border:3px solid;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:1.75rem;overflow:hidden}
.lg-face img{width:100%;height:100%;object-fit:cover}
.lg-type{margin:.5rem .625rem 0;padding:.1875rem .5rem;border-radius:4px;font-size:.6875rem;line-height:1rem;font-weight:700;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lg-stats{flex:1;padding:.375rem .75rem 0;display:flex;flex-direction:column;gap:.4375rem}
.lg-st{display:grid;grid-template-columns:1.25rem minmax(0,1fr) auto;align-items:center;gap:2px .5rem}
.lg-st i{width:1.25rem;height:1.25rem;border-radius:50%;display:flex;align-items:center;justify-content:center;font:700 .5625rem/1 var(--body);color:#fff;font-style:normal;grid-row:span 2}
.lg-st span{font-size:.8125rem;line-height:1rem;font-weight:600;color:#d9cdbb;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lg-st b{font-size:.9375rem;line-height:1rem;font-weight:700;text-align:right}
.lg-st u{grid-column:2/4;display:block;height:.25rem;border-radius:2px;background:rgb(255 255 255 / .1);position:relative;overflow:hidden;text-decoration:none}
.lg-st u s{position:absolute;inset:0 auto 0 0;border-radius:2px;text-decoration:none}
.lg-flav{margin:0;padding:2px .75rem 0;font-size:.6875rem;line-height:.875rem;font-style:italic;color:#b7abab;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lg-ft{display:flex;justify-content:space-between;align-items:center;gap:.5rem;padding:.375rem .75rem .625rem;font-size:.6875rem;line-height:.875rem;color:#a29595}
.lg-mini{display:flex;gap:.625rem;min-width:0}
.lg-mini span{display:flex;flex-direction:column;line-height:.75rem}
.lg-mini small{font-size:.5rem;line-height:.625rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#8a7f7f}
.lg-mini b{font-size:.75rem;line-height:.875rem;font-weight:700;color:#ece7e7}
.lg-ft span{font-weight:700;white-space:nowrap}
@keyframes lgHolo{0%{background-position:0% 50%}100%{background-position:200% 50%}}
.lg-holo{position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 20%,rgb(255 255 255 / .22) 35%,rgb(255 214 140 / .28) 45%,rgb(160 220 255 / .22) 55%,transparent 70%);background-size:200% 100%;animation:lgHolo 4s linear infinite;mix-blend-mode:screen}
@media (prefers-reduced-motion:reduce){.lg-holo{animation:none}}
/* The character pane and its stats sit side by side when the card is wide enough, stacked when it isn't */
.gear-card{container:gear/inline-size}
.gear-body{display:flex;flex-direction:column;gap:.75rem;align-items:center}
@container gear (min-width:640px){.gear-body{flex-direction:row;align-items:stretch;justify-content:center}.gear-body>.doll,.gear-body>.stats{flex:1 1 0;align-self:stretch}.gear-body>.stats{align-content:start}}
.doll{background:radial-gradient(ellipse at 50% 45%,var(--glow,rgb(184 40 42 / .12)) 0%,#0f0e0e 70%);border:1px solid #3d3737;border-radius:8px;padding:.75rem;display:grid;grid-template-columns:2.75rem minmax(0,1fr) 2.75rem;gap:0 .75rem;width:100%;max-width:22.5rem;align-self:center;position:relative}
.doll-col{display:flex;flex-direction:column;gap:.375rem}
.doll-mid{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;position:relative;min-width:0}
.doll-col{position:relative;z-index:1}
.doll-render{position:absolute;inset:0 -.5rem 3.25rem;width:calc(100% + 1rem);height:calc(100% - 3.25rem);object-fit:cover;object-position:50% 45%;transform:scale(1.4);transform-origin:50% 50%;pointer-events:none;filter:drop-shadow(0 6px 10px rgb(0 0 0 / .5))}
.doll-row{position:relative}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.75rem 1.25rem;width:100%;max-width:22.5rem;align-self:center;background:#0f0e0e;border:1px solid #3d3737;border-radius:8px;padding:.75rem .875rem;color:#ece7e7}
.stats h3{font-size:.75rem;line-height:1rem;letter-spacing:.06em;text-transform:uppercase;color:#a29595;margin:0 0 .25rem;font-weight:700}
.stats .sr{display:flex;justify-content:space-between;gap:.5rem;font-size:.8125rem;line-height:1.25rem}
.stats .sr span{color:#b7abab}.stats .sr b{font-weight:600;white-space:nowrap}
.tal-tree{display:flex;flex-direction:column;gap:.5rem;padding-top:.75rem;border-top:1px solid var(--sep)}
.tal-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,13.125rem),1fr));gap:2px .75rem}
.tal summary{display:flex;align-items:center;gap:.625rem;cursor:pointer;list-style:none;min-height:2.625rem}
.tal summary::-webkit-details-marker{display:none}
.tal[open] summary b{color:var(--accent-text)}
.tal-ico-wrap{position:relative;flex:none;width:2.125rem;height:2.125rem}
.tal-ico{width:2.125rem;height:2.125rem;border-radius:6px;border:1px solid var(--b-def);display:block;background:var(--sunken)}
.tal-ico.lg{width:2.5rem;height:2.5rem;flex:none}
.tal-rank{position:absolute;right:-.3125rem;bottom:-.3125rem;min-width:1.0625rem;height:1.0625rem;padding:0 .25rem;border-radius:9px;background:#0f0e0e;border:1px solid #4a4242;font:700 .6875rem/.9375rem var(--body);color:#1eff00;text-align:center}
.spot{display:grid;grid-template-columns:13.75rem minmax(0,1fr);padding:0;gap:0;overflow:hidden}
.spot-art{position:relative;min-height:14.75rem;background:#0f0e0e center/cover no-repeat;display:block;overflow:hidden}
.spot-art img.r{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 45%;transform:scale(1.35);filter:drop-shadow(0 6px 10px rgb(0 0 0 / .5))}
.spot-art .face{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:6rem;height:6rem;border-radius:50%;border:3px solid;display:flex;align-items:center;justify-content:center;font:700 2.125rem/1 var(--display);background:#0f0e0e;overflow:hidden}
.spot-art .face img{width:100%;height:100%;object-fit:cover}
.spot-body{padding:1.25rem 1.5rem;display:flex;flex-direction:column;gap:.5rem;min-width:0}
.spot-name{font-family:var(--display);font-weight:700;font-size:1.8125rem;line-height:2.125rem;color:var(--text);text-decoration:none}
.spot-name:hover{color:var(--link-hover)}
.eyebrow{font-size:.75rem;line-height:1rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-text)}
@media (max-width:560px){.spot{grid-template-columns:8rem minmax(0,1fr)}.spot-art{min-height:13.125rem}.spot-body{padding:.875rem 1rem}.spot-name{font-size:1.5rem;line-height:1.75rem}}
.chips{display:flex;flex-wrap:wrap;gap:.375rem}
.chip{display:inline-flex;align-items:center;gap:.375rem;padding:.1875rem .625rem .1875rem .5rem;border:1px solid var(--sep);border-radius:999px;font-size:.8125rem;line-height:1.125rem;text-decoration:none;color:var(--text);background:var(--sunken)}
.chip:hover{border-color:var(--b-def);color:var(--text)}
.chip.away{border-style:dashed;color:var(--sec)}.chip.away .cls-ic{opacity:.6}
.chip .ter{font-size:.75rem}
.range-row{display:flex;flex-direction:column;gap:.75rem;padding:.875rem 0 .25rem;border-top:1px solid var(--sep)}
.range-cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.75rem}
@media (max-width:600px){.range-cols{grid-template-columns:minmax(0,1fr)}}
.range-col{display:flex;flex-direction:column;gap:.375rem;min-width:0;padding:.625rem .75rem;background:var(--sunken);border:1px solid var(--sep);border-radius:8px}
.range-col .chips{flex-direction:column;align-items:flex-start}
/* Card stamps: little seals on the picture for things the character has done */
.lg-stamps{position:absolute;left:.5rem;bottom:.375rem;display:flex;gap:.25rem;z-index:1}
.lg-stamp{width:1.625rem;height:1.625rem;border-radius:50%;display:grid;place-items:center;font-size:.5rem;line-height:1;font-weight:700;letter-spacing:.02em;background:rgb(15 14 14 / .85);border:1.5px solid currentColor;box-shadow:0 1px 3px rgb(0 0 0 / .5)}
/* Suggest a group */
.suggest{display:flex;flex-direction:column;gap:.5rem;padding:.75rem .875rem;border:1px dashed var(--b-def);border-radius:8px}
.suggest-row{display:grid;grid-template-columns:4.5em minmax(0,1fr);gap:.5rem;align-items:center;font-size:.8125rem;line-height:1.125rem}
/* History */
.hist-days{gap:0;padding-block:.25rem}
.hist-day{border-top:1px solid var(--sep)}.hist-day:first-child{border-top:0}
.hist-day>summary{list-style:none;display:flex;align-items:center;gap:.75rem;min-height:3rem;padding:.375rem 0;cursor:pointer}
.hist-day>summary::-webkit-details-marker{display:none}
.hist-day>summary::before{content:"";flex:none;width:.4375rem;height:.4375rem;border-right:2px solid var(--ter);border-bottom:2px solid var(--ter);transform:rotate(-45deg);margin:0 .1875rem 0 1px;transition:transform 150ms cubic-bezier(.23,1,.32,1)}
.hist-day[open]>summary::before{transform:rotate(45deg)}
.hist-day>summary h2{font-size:1.0625rem;line-height:1.5rem;margin:0;flex:1;min-width:0}
.hist-day>summary:hover h2{color:var(--accent-text)}
.hist-day>summary:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
.hist-day[open]{padding-bottom:.5rem}
@media (prefers-reduced-motion:reduce){.hist-day>summary::before{transition:none}}
.hist-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.75rem;align-items:baseline;padding:.5rem 0;border-top:1px solid var(--sep)}
/* More menu */
details.more{position:relative}
details.more summary{list-style:none;cursor:pointer}
details.more summary::-webkit-details-marker{display:none}
details.more summary::after{content:"";width:.4375rem;height:.4375rem;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:translateY(-2px) rotate(45deg);margin-left:.5rem}
details.more[open] summary::after{transform:translateY(2px) rotate(-135deg)}
.more-menu{position:absolute;right:0;top:calc(100% + .375rem);z-index:30;min-width:13.75rem;display:flex;flex-direction:column;padding:.375rem;background:var(--overlay);border:1px solid var(--b-sub);border-radius:8px;box-shadow:0 8px 24px rgb(0 0 0 / .35)}
.more-menu button{font:inherit;font-size:.875rem;line-height:1.25rem;text-align:left;background:none;border:0;border-radius:6px;padding:.5625rem .625rem;min-height:2.5rem;color:var(--text);cursor:pointer}
.more-menu button:hover,.more-menu button:focus-visible{background:var(--subtle)}
.more-h{font-size:.75rem;line-height:1rem;font-weight:600;color:var(--ter);padding:.5rem .625rem 2px}
@media (max-width:700px){.more-menu{right:auto;left:0}}
/* Card duels */
.duel-pick{display:flex;flex-wrap:wrap;gap:.375rem}
.duel-pick .chip{cursor:pointer;font:inherit;font-size:.8125rem;line-height:1.125rem;background:var(--raised)}
.duel-pick .chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-subtle);color:var(--text);font-weight:600}
.duel-pick .chip:disabled{opacity:.45;cursor:default}
.duel-arena{display:flex;flex-wrap:wrap;gap:1.25rem;justify-content:center}
.duel-f{display:flex;flex-direction:column;align-items:center;gap:.5rem}
.duel-place{font-weight:600;font-variant-numeric:tabular-nums;color:var(--sec)}
.duel-place.win{color:var(--lvl)}
.duel-result{text-align:center;display:flex;flex-direction:column;gap:.25rem;align-items:center}
.duel-result b{font-family:var(--display);font-weight:700;font-size:1.8125rem;line-height:2.125rem}
.duel-rounds{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,18.75rem),1fr));gap:.75rem}
.duel-r{display:flex;flex-direction:column;gap:.375rem;padding:.75rem .875rem;background:var(--raised);border:1px solid var(--sep);border-radius:8px}
.duel-r h3{display:flex;justify-content:space-between;gap:.5rem;margin:0;font-size:.875rem;line-height:1.25rem}
.duel-r h3{flex-wrap:wrap;row-gap:0}.duel-r h3 span{font-weight:400;color:var(--sec);overflow-wrap:break-word;min-width:0}
.duel-l .duel-why{grid-column:1/-1;font-size:.75rem;line-height:1rem;color:var(--gold);margin:-2px 0 .25rem}
:root[data-theme="light"] .duel-l .duel-why{color:#8a5a12}
.duel-l{display:grid;grid-template-columns:minmax(0,11em) minmax(0,1fr) auto;gap:.5rem;align-items:center;font-size:.8125rem;line-height:1.125rem}
.duel-l .nm{display:flex;gap:.375rem;align-items:center;min-width:0}
.duel-l .nm span{min-width:0;overflow-wrap:break-word}/* long names wrap rather than get cut off (bigger text sizes, narrow phones) */
.duel-l .v{font-variant-numeric:tabular-nums;color:var(--sec);white-space:nowrap}
.duel-l.win .v,.duel-l.win .nm{color:var(--text);font-weight:600}
.duel-l .track i{background:var(--bar)}.duel-l.win .track i{background:var(--accent)}
.duel-anim .duel-r{animation:duelIn .35s cubic-bezier(.23,1,.32,1) both}
@keyframes duelIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.duel-anim .duel-r{animation:none}}
/* Guild totals */
.totals{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1px;background:var(--sep);border:1px solid var(--sep);border-radius:8px;overflow:hidden}
.total{display:flex;flex-direction:column;gap:2px;padding:.75rem .875rem;background:var(--raised);min-width:0}
.total b{font-family:var(--display);font-weight:700;font-size:1.5rem;line-height:1.75rem;font-variant-numeric:tabular-nums;color:var(--text)}
.total span{font-size:.75rem;line-height:1rem;color:var(--sec)}
.total small{font-size:.75rem;line-height:1rem;color:var(--accent-text);font-variant-numeric:tabular-nums}
@media (max-width:640px){.totals{grid-template-columns:repeat(3,minmax(0,1fr))}.total{padding:.625rem .75rem}.total b{font-size:1.25rem;line-height:1.5rem}.total span,.total small{font-size:.6875rem;line-height:.875rem}.total:last-child{grid-column:span 2}}
/* Hall of Firsts */
.first-row{display:grid;grid-template-columns:6.2em minmax(0,1fr) auto;gap:.5rem;align-items:baseline;padding:.4375rem 0;border-top:1px solid var(--sep);font-size:.8125rem;line-height:1.125rem}
.first-row:first-child{border-top:0}
.first-row .who{display:flex;flex-direction:column;gap:2px;min-width:0}
/* Card binder */
.binder{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,16.25rem),1fr));gap:1.25rem;justify-items:center}
.binder-it{display:flex;flex-direction:column;align-items:center;gap:.5rem}
/* Card flip: the back has stats, talents, professions and any Hall of Firsts */
.lg-flip{display:block;width:16.25rem;height:23.75rem;perspective:1200px;flex:none;cursor:pointer;border-radius:16px}
.lg-flip:focus-visible{outline-offset:4px}
.lg-flip-in{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.23,1,.32,1)}
.lg-flip.on .lg-flip-in{transform:rotateY(180deg)}
.lg-flip .lg-card{position:absolute;inset:0;-webkit-backface-visibility:hidden;backface-visibility:hidden}
.lg-flip .lg-back{transform:rotateY(180deg)}
@media (prefers-reduced-motion:reduce){.lg-flip-in{transition:none}}
.lg-bsec{padding:.4375rem .75rem 0}
.lg-bsec h4{margin:0 0 .1875rem;font-size:.5rem;line-height:.625rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#8a7f7f}
.lg-bgrid{display:grid;grid-template-columns:1fr 1fr;column-gap:.75rem}
.lg-br{display:flex;justify-content:space-between;align-items:baseline;gap:.375rem;font-size:.6875rem;line-height:.9375rem;color:#b7abab;min-width:0}
.lg-br span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.lg-br b{color:#ece7e7;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.lg-br.on span{color:#ece7e7}
.lg-pbar{display:block;height:.1875rem;border-radius:2px;background:#292525;margin:1px 0 .1875rem;overflow:hidden}
.lg-pbar i{display:block;height:100%;border-radius:2px}
.lg-tabs{display:flex;gap:.1875rem;margin:2px .75rem 0;padding:.1875rem;border-radius:6px;background:#171515}
.lg-tab{flex:1;font:inherit;font-size:.625rem;line-height:1.125rem;font-weight:600;border:0;border-radius:4px;background:none;color:#8a7f7f;cursor:pointer;padding:1px .25rem}
.lg-tab[aria-selected="true"]{background:#292525;color:#ece7e7}
.lg-pane[hidden]{display:none}
.lg-pgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:.375rem .25rem;padding:.625rem .75rem 0;justify-items:center}
.lg-pstamp{width:1.875rem;height:1.875rem;border-radius:50%;display:grid;place-items:center;font-size:.4375rem;line-height:1;font-weight:700;letter-spacing:.02em;color:#ffd77a;border:1.5px solid #e6bc77;background:radial-gradient(circle at 40% 35%,#5a1f20,#2a1213 70%);box-sizing:border-box}
.lg-pstamp.off{color:#4a4242;border:1.5px dashed #3d3737;background:none}
/* Dungeon passport section */
.pass-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,7rem),1fr));gap:.875rem .5rem}
.pass-st{display:flex;flex-direction:column;align-items:center;text-align:center;gap:.1875rem;min-width:0;font:inherit;color:inherit;background:none;border:0;padding:.25rem;border-radius:8px}
button.pass-st{cursor:pointer}button.pass-st:hover .pass-seal{border-color:var(--lvl)}
.pass-seal{width:3.375rem;height:3.375rem;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:.8125rem;line-height:1;border:2px dashed var(--b-def);color:var(--ter);background:var(--sunken)}
.pass-st.on .pass-seal{border:2px solid #e6bc77;color:#ffd77a;background:radial-gradient(circle at 40% 35%,#5a1f20,#2a1213 70%);box-shadow:0 0 0 3px rgb(230 188 119 / .12);transform:rotate(-8deg)}
.pass-st b{font-weight:600;font-size:.75rem;line-height:1rem}.pass-st:not(.on) b{color:var(--sec);font-weight:400}
.pass-st small{font-size:.6875rem;line-height:.875rem;color:var(--ter)}.pass-st.on small{color:var(--lvl)}
.lg-none{margin:0;font-size:.6875rem;line-height:.9375rem;color:#8a7f7f}
.lg-back .lg-ft{margin-top:auto}
/* Ding: your own card turns to face you and the new level is pressed on as a seal. Stays until closed. */
.cr{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:1rem;overflow:auto}
.cr-scrim{position:absolute;inset:0;background:radial-gradient(circle at 50% 36%,rgb(74 52 24 / .42),rgb(74 52 24 / 0) 52%),rgb(8 7 7 / .92);animation:crFade 250ms ease-out both}
.cr-stage{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;max-width:26.25rem;outline:0;animation:crIn 250ms cubic-bezier(.23,1,.32,1) both}
.cr-card{position:relative;margin:.25rem 0 1.5rem}
.cr-card::before{content:"";position:absolute;inset:-4.5rem;background:radial-gradient(closest-side,rgb(230 188 119 / .32),rgb(230 188 119 / 0));z-index:-1;pointer-events:none}
.cr-card .lg-card{box-shadow:0 22px 48px rgb(0 0 0 / .65)}.cr-card .lg-flip{cursor:default}
.cr-seal{position:absolute;right:-2.125rem;top:3.25rem;width:4.875rem;height:4.875rem;border-radius:50%;display:grid;place-items:center;align-content:center;font:700 2.125rem/1 var(--display);color:#ffe9b0;text-shadow:0 1px 0 #3a0a0a;
  background:radial-gradient(circle at 36% 30%,#d9483f,#a32420 46%,#5e1012 100%);box-shadow:0 0 0 3px #e6bc77,0 0 0 7px rgb(15 14 14 / .55),0 10px 22px rgb(0 0 0 / .55);transform:rotate(-11deg);animation:crSeal 240ms cubic-bezier(.23,1,.32,1) 720ms both}
.cr-seal small{display:block;font:700 .5625rem/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:#f6d79a;margin-bottom:.1875rem}
.cr-t{margin:0;font:600 1.375rem/1.75rem var(--body);color:#f1ebe6;text-wrap:balance;animation:crRise 220ms cubic-bezier(.23,1,.32,1) 820ms both}
.cr-s{margin:.25rem 0 0;font:400 .9375rem/1.375rem var(--body);color:#cdbfb0;text-wrap:balance;animation:crRise 220ms cubic-bezier(.23,1,.32,1) 860ms both}
.cr-act{display:flex;flex-wrap:wrap;justify-content:center;gap:.5rem;margin-top:1.125rem;animation:crRise 220ms cubic-bezier(.23,1,.32,1) 900ms both}
.cr-act .btn:not(.primary){color:#ece7e7;border-color:#4a4242}.cr-act .btn:not(.primary):hover{background:#332e2e}
.cr.out .cr-scrim{animation:crFadeOut 200ms ease both}.cr.out .cr-stage{animation:crOut 200ms ease both}
.lg-card.foil.cr-shine::after{animation:lgShine .9s cubic-bezier(.23,1,.32,1) forwards}
@keyframes crFade{from{opacity:0}to{opacity:1}}@keyframes crFadeOut{to{opacity:0}}
@keyframes crIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}@keyframes crOut{to{opacity:0;transform:scale(.96)}}
@keyframes crSeal{from{opacity:0;transform:rotate(-26deg) scale(1.35)}to{opacity:1;transform:rotate(-11deg) scale(1)}}
@keyframes crRise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (max-width:599px){.cr-card{transform:scale(.86);margin:-1.5rem 0 -.375rem}.cr-seal{right:-1.625rem}.cr-t{font-size:1.1875rem;line-height:1.5rem}.cr-s{font-size:.875rem;line-height:1.25rem}}
/* Guild milestones: a toast shaped like the in-game player frame. Closes after 4 seconds, waits while pointed at, swipes away. */
.uf{position:fixed;z-index:41;right:calc(2rem + env(safe-area-inset-right,0px));bottom:calc(2rem + env(safe-area-inset-bottom,0px));width:24rem;display:flex;gap:1rem;align-items:center;padding:1rem 1rem 1.125rem;border-radius:12px;
  background:var(--raised);border:1px solid var(--b-def);box-shadow:0 14px 36px rgb(0 0 0 / .45),0 0 0 4px rgb(230 188 119 / .08);overflow:hidden;touch-action:pan-y;user-select:none;-webkit-user-select:none;animation:ufIn 400ms ease both}
.uf.in{animation:none}.uf.drag{transition:none!important;cursor:grabbing}.uf.back{transition:transform 200ms cubic-bezier(.23,1,.32,1)}
.uf.gone{transition:transform 200ms cubic-bezier(.23,1,.32,1),opacity 200ms ease-out;opacity:0}.uf.out{animation:ufOut 300ms ease both}
.uf-por{position:relative;width:4.25rem;height:4.25rem;flex:none;border-radius:50%;padding:.1875rem;background:conic-gradient(from 200deg,#fff1c9,#b8862e,#e6bc77,#7a5a1c,#fff1c9)}
.uf-face{width:100%;height:100%;border-radius:50%;overflow:hidden;border:2px solid #0f0e0e;background:#0f0e0e}.uf-face img{width:100%;height:100%;display:block}
.uf-lv{position:absolute;left:-.4375rem;bottom:-.3125rem;min-width:1.875rem;height:1.875rem;padding:0 .3125rem;border-radius:15px;display:grid;place-items:center;background:#0f0e0e;border:2px solid #e6bc77;color:#ffd77a;font:700 .875rem/1 var(--body);font-variant-numeric:tabular-nums;box-shadow:0 0 12px rgb(230 188 119 / .45)}
.uf-body{min-width:0;flex:1}
.uf-name{font:600 .9375rem/1.25rem var(--body);color:var(--text);padding-right:1.75rem}
.uf-xp{height:.375rem;border-radius:3px;background:var(--sunken);border:1px solid var(--b-sub);margin:.4375rem 0 .5rem;overflow:hidden}
.uf-xp i{display:block;height:100%;transform-origin:left center;transform:scaleX(.94);background:linear-gradient(90deg,#8a6a2a,#e6bc77 70%,#fff1c9);animation:ufFill 450ms cubic-bezier(.23,1,.32,1) 380ms forwards}
.uf-t{font:700 1.3125rem/1.5rem var(--display);color:var(--lvl)}
.uf-s{font:400 .8125rem/1.125rem var(--body);color:var(--sec);margin-top:2px}
.uf-x{position:absolute;right:.5rem;top:.5rem;width:1.75rem;height:1.75rem;border-radius:6px;border:0;background:none;color:var(--ter);font:600 .875rem/1 var(--body);cursor:pointer}
.uf-x::before{content:"";position:absolute;inset:-.5rem}.uf-x:hover{color:var(--text);background:var(--subtle)}

/* ---------- render ---------- */
function route(){const p=(location.hash||"#roster").slice(1).split("/");if(p[0]==="char")return{page:"char",coll:p[1],id:p[2]};if(p[0]==="history")return{page:"history"};if(p[0]==="duel")return{page:"duel",ids:decodeURIComponent(p[1]||"").split(",").filter(Boolean)};const pg=p[0]==="raids"||p[0]==="events"||p[0]==="trades"?"lfg":p[0];return{page:PAGES.some(x=>x[0]===pg)?pg:"roster"}}
function render(){
  const app=$("#app");
  const keep=document.activeElement&&document.activeElement.id,typed={};
  // Typed text survives a redraw; checkboxes always show what's saved.
  for(const el of app.querySelectorAll("input[id],textarea[id],select[id]"))if(el.type!=="checkbox")typed[el.id]=el.value;
  if(!configured){app.replaceChildren(h("main",{class:"wrap"},h("div",{class:"note warn"},"This copy isn't connected to Firebase yet. Paste your project's config into firebase-config.js.")));return}
  if(S.authError){app.replaceChildren(h("main",{class:"wrap",style:"padding-top:3rem"},h("div",{class:"note warn"},S.authError)));return}
  if(!S.user){app.replaceChildren(h("main",{class:"wrap",style:"padding-top:3rem"},h("p",{class:"ter"},"Loading…")));return}
  const r=route();
  const views={roster:viewRoster,lfg:viewLfg,cards:viewCards,professions:viewProfessions};
  const body=r.page==="char"?viewChar(r.coll,r.id):r.page==="duel"?viewDuel(r.ids):r.page==="history"?viewHistory():views[r.page]();
  // Quick saves finish in well under a second, so "Syncing" only shows if a save is still waiting after 2 seconds.
  const net=!navigator.onLine?(S.pending?"You're offline. Your changes are saved on this device and will sync when you reconnect.":"You're offline. Showing the last copy saved on this device."):S.slowSync?"Still syncing your changes…":"";
  app.replaceChildren(...[header(r.page==="char"?"":r.page==="duel"?"cards":r.page==="history"?"roster":r.page),
    net?h("div",{class:"netbar",role:"status"},net):null,
    h("main",{class:"wrap"},
    S.error?h("div",{class:"note warn"},S.error):null,
    S.saveErr?h("div",{class:"note warn spread",role:"alert"},h("span",{},S.saveErr),h("button",{class:"btn sm",onclick:()=>{S.saveErr="";render()}},"OK")):null,
    !S.loaded&&!S.error?h("div",{class:"note"},"Loading the roster…"):null,
    body)].filter(Boolean));
  for(const[id,v]of Object.entries(typed)){const el=document.getElementById(id);if(!el||el.closest("dialog"))continue;el.value=v}
  if(keep){const el=document.getElementById(keep);if(el)el.focus()}
  checkDing();checkMilestones();markVisit()}
let rq=0;const schedule=()=>{if(rq)return;rq=requestAnimationFrame(()=>{rq=0;if(!$("#dlg").open)render();else schedule._pending=true})};
$("#dlg").addEventListener("close",()=>{if(schedule._pending){schedule._pending=false;render()}});
let syncTimer=0;
function setPending(p){S.pending=p;if(!p){clearTimeout(syncTimer);syncTimer=0;if(S.slowSync){S.slowSync=false;schedule()}return}
  if(!syncTimer)syncTimer=setTimeout(()=>{syncTimer=0;if(S.pending&&navigator.onLine){S.slowSync=true;schedule()}},2000)}
function subscribe(){
  S.unsub.forEach(u=>u());S.unsub=[];S.loaded=false;S.error="";
  const fail=e=>{S.error=e&&e.code==="permission-denied"?"You don't have access to the roster.":"The roster stopped updating. Reload the page to reconnect.";schedule()};
  const live=(name,fn)=>S.unsub.push(onSnapshot(collection(db,name),{includeMetadataChanges:true},snap=>{fn(snap.docs.map(d=>{const x={id:d.id,...d.data()};if(x.profs&&Object.keys(x.profs).some(p=>CLASS_SKILLS[p])){x.profs={...x.profs};for(const p in CLASS_SKILLS)delete x.profs[p]}return x}));if(name==="members"){setPending(snap.metadata.hasPendingWrites);S.loaded=true}schedule()},name==="members"?fail:()=>{}));
  // Real names stay off the site: clear the Google name the first version saved, wherever you're allowed to.
  const stripped=new Set();
  const strip=list=>{for(const m of list){if(!canEdit(m)||stripped.has(m.id)||!("player" in m))continue;
    stripped.add(m.id);updateDoc(charRef(m),{player:deleteField()}).catch(()=>{})}};
  live("members",x=>{S.members=x;strip(x);setTimeout(checkLinkHash)});
  live("alts",x=>{S.alts=x.map(a=>({...a,isAlt:true}));strip(S.alts)});
  S.unsub.push(onSnapshot(doc(db,"guild","officers"),snap=>{S.officers=snap.exists()?snap.data():null;schedule()},()=>{}));
  S.unsub.push(onSnapshot(doc(db,"guild","itemIds"),snap=>{S.itemIds=snap.exists()?snap.data().items||{}:{};S.itemIdsReady=true;schedule()},()=>{S.itemIdsReady=true}));
  S.unsub.push(onSnapshot(doc(db,"guild","roster"),snap=>{S.guildRoster=snap.exists()?snap.data():null;schedule()},()=>{}));
  S.unsub.push(onSnapshot(doc(db,"guild","armory"),snap=>{S.armoryAll=snap.exists()?snap.data():null;schedule()},()=>{}));
  S.unsub.push(onSnapshot(doc(db,"guild","info"),snap=>{S.guild=snap.exists()?snap.data():{};schedule()},()=>{}));
  S.unsub.push(onSnapshot(doc(db,"guild","firsts"),snap=>{const d=snap.exists()?snap.data():{};S.firsts=d.list||{};S.milestones=d.milestones||{};S.firstsReady=true;schedule()},()=>{S.firstsReady=true;schedule()}));
}
addEventListener("online",render);addEventListener("offline",render);
// Refresh who's online every minute while the page is open.
if(DISCORD_SERVER_ID){loadWidget();setInterval(loadWidget,60000);document.addEventListener("visibilitychange",()=>{if(!document.hidden)loadWidget()})}
addEventListener("hashchange",()=>{if(/^#link\//.test(location.hash))return checkLinkHash();render();scrollTo(0,0)});
// No sign-in screen: each browser quietly gets its own anonymous ID, and characters remember which IDs can edit them.
if(configured){onAuthStateChanged(auth,u=>{S.user=u;
  if(u){subscribe();render()}
  else signInAnonymously(auth).catch(e=>{S.authError=e&&e.code==="auth/operation-not-allowed"
    ?"Anonymous sign-in is turned off. In the Firebase console go to Authentication, Sign-in method, and turn on Anonymous."
    :navigator.onLine?"Couldn't connect. Reload the page to try again.":"You need a connection the first time you open the site.";render()})})}
else render();
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("/sw.js").catch(()=>{}));
</script>

<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Blood and Tears</title>
<meta name="description" content="Blood and Tears guild roster for WoW Forever.">
<meta name="theme-color" content="#0f0a09" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f5efe8" media="(prefers-color-scheme: light)">
<meta name="robots" content="noindex, nofollow">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Blood and Tears">
<meta property="og:title" content="Blood and Tears">
<meta property="og:description" content="Horde guild on WoW Forever. Roster, dungeons, professions, trading cards and the Hall of Firsts.">
<meta property="og:url" content="https://bloodandtears.web.app/">
<meta property="og:image" content="https://bloodandtears.web.app/og-gingerbread.png">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Blood and Tears, a Horde guild on WoW Forever">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://bloodandtears.web.app/og-gingerbread.png">
<script>try{const t=localStorage.getItem("lg-theme");if(t==="dark"||t==="light")document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&family=Alegreya+Sans+SC:wght@500;700&display=swap">
<link rel="stylesheet" href="ds-tokens.css">
<style>
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0}
[hidden]{display:none!important}

/* Obsidian: near-black by default, light on request. */
:root{
  /* Every colour comes from the design system (ds-tokens.css, built from opendesigner/): the tabard's crimson field,
     gingerbread gold and bright green trim, with red-brown neutrals. These short names are the site's aliases for them,
     and they switch with the theme on their own. Change a colour in the system (engine.py set, then build) and copy
     opendesigner/build/css/tokens.css into public/ds-tokens.css with sh tools/ds-tokens.sh. */
  --sunken:var(--ds-color-surface-sunken);--base:var(--ds-color-surface-base);--raised:var(--ds-color-surface-raised);--overlay:var(--ds-color-surface-overlay);--subtle:var(--ds-color-bg-neutral-subtle);--sep:var(--ds-color-border-separator);--b-sub:var(--ds-color-border-subtle);--b-def:var(--ds-color-border-default);
  --field-b:var(--ds-color-border-input);--text:var(--ds-color-text-primary);--sec:var(--ds-color-text-secondary);--ter:var(--ds-color-text-tertiary);--accent:var(--ds-color-bg-action-primary);--on-accent:var(--ds-color-text-on-action);--accent-text:var(--ds-color-text-accent);--gold-hi:var(--ds-color-site-gold-hi);
  --ginger:var(--ds-color-site-ginger);--accent-hover:var(--ds-color-bg-action-primary-hover);--link-hover:var(--ds-color-site-link-hover);--accent-subtle:var(--ds-color-bg-accent-subtle);--accent-b:var(--ds-color-border-accent);--focus:var(--ds-color-border-focus);--trim:var(--ds-color-site-trim);--trim-deep:var(--ds-color-site-trim-deep);
  --wine:var(--ds-color-bg-brand);--wine-text:var(--ds-color-site-wine-text);--info-subtle:var(--ds-color-bg-info-subtle);--info-text:var(--ds-color-text-info);--danger:var(--ds-color-text-danger);--bar:var(--ds-color-site-bar);--scrim:var(--ds-color-overlay-scrim);--q0:var(--ds-color-site-q0);
  --q1:var(--ds-color-site-q1);--q2:var(--ds-color-site-q2);--q3:var(--ds-color-site-q3);--q4:var(--ds-color-site-q4);--q5:var(--ds-color-site-q5);--q6:var(--ds-color-site-q6);--gold:var(--ds-color-site-gold);--lvl:var(--ds-color-site-lvl);
  --silver:var(--ds-color-site-silver);--copper:var(--ds-color-site-copper);
  --display:"Alegreya Sans SC",Figtree,sans-serif;
  --body:Figtree,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  color-scheme:dark;
}
:root[data-theme="light"]{color-scheme:light}
body{background:var(--base);color:var(--text);font-family:var(--body);font-size:.875rem;line-height:1.25rem;font-variant-numeric:tabular-nums;min-height:100vh}
a{color:var(--accent-text)}a:hover{color:var(--link-hover)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:75rem;margin:0 auto;padding-left:max(1.5rem,env(safe-area-inset-left,0px));padding-right:max(1.5rem,env(safe-area-inset-right,0px))}
@media (max-width:600px){.wrap{padding-left:max(1rem,env(safe-area-inset-left,0px));padding-right:max(1rem,env(safe-area-inset-right,0px))}}

/* Header */
header.top{background:var(--sunken);border-bottom:3px solid var(--trim);box-shadow:inset 0 -1px 0 var(--trim-deep);padding-top:env(safe-area-inset-top,0px)}
header.top .wrap{padding-block:.75rem;display:flex;flex-wrap:wrap;gap:.5rem 1.25rem;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:.75rem;text-decoration:none}.brand-logo{width:2.5rem;height:2.5rem;flex:none;filter:drop-shadow(0 1px 2px rgb(0 0 0/.4))}
.brand b{font-family:var(--display);font-weight:600;font-size:1.5rem;line-height:2rem;color:var(--accent-text)}
.brand span{font-size:.75rem;color:var(--ter)}
nav.main{display:flex;flex-wrap:wrap;gap:.25rem;font-weight:600}
nav.main a{color:var(--sec);text-decoration:none;padding:.625rem .75rem;border-radius:6px}
nav.main a:hover{color:var(--text)}
nav.main a[aria-current="page"]{color:var(--text);background:var(--accent-subtle);box-shadow:inset 0 -2px 0 var(--accent)}
.hdr-tools{display:flex;align-items:center;gap:.375rem}
.hdr-tools .btn{height:2rem;padding:0 .625rem;font-size:.875rem}
@media (max-width:1320px){.brand span{display:none}}
/* Wide: the "Horde · WoW Forever" line sits under the name, so brand, menu and tools stay on one row */
@media (min-width:1321px){.brand{display:grid;grid-template-columns:auto auto;column-gap:.75rem;row-gap:0;align-items:center}.brand-logo{grid-row:1/3}.brand b{line-height:1.625rem}.brand span{line-height:1rem}}
/* The tools always stay on the right of the first row */
.hdr-tools{margin-left:auto}
@media (max-width:1199px){
  header.top .wrap{padding-bottom:0}
  nav.main{order:3;width:100%;flex-wrap:nowrap;overflow-x:auto;margin:0 -.75rem;padding:0 .75rem .5rem;scrollbar-width:none}
  nav.main a{white-space:nowrap}
}

main{padding-block:2rem 4rem;display:flex;flex-direction:column;gap:1.5rem}
h1{margin:0;font-family:var(--display);font-weight:600;font-size:2rem;line-height:2.5rem}
h2{margin:0;font-family:var(--display);font-weight:600;font-size:1.25rem;line-height:1.75rem}
h2.big{font-size:1.25rem;line-height:1.75rem}
h3{margin:0;font-weight:600;font-size:1rem;line-height:1.5rem}
p{margin:0}
.sub{color:var(--sec)}
.ter{color:var(--ter)}
.small{font-size:.75rem;line-height:1rem}
.page-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:1rem}
/* Option I: the logo leads each page title, on a soft blood-red glow; panels get a touch of depth */
.ph-logo{position:relative;isolation:isolate}
.ph-logo::before{content:"";position:absolute;z-index:-1;pointer-events:none;left:-3rem;top:-3rem;bottom:-3rem;width:min(30rem,calc(100% + 3rem));background:radial-gradient(closest-side,rgb(165 13 44 / .3),transparent)}
:root[data-theme="light"] .ph-logo::before{background:radial-gradient(closest-side,rgb(165 13 44 / .12),transparent)}
.page-head>div.ph-id:first-child{display:flex;flex-direction:row;align-items:center;gap:1rem;min-width:0}.ph-id>div{min-width:0;display:flex;flex-direction:column;gap:.25rem}
.ph-mark{flex:none;width:3.5rem;height:3.5rem;filter:drop-shadow(0 4px 10px rgb(0 0 0 / .45))}
@media (max-width:640px){.ph-mark{width:2.75rem;height:2.75rem}.page-head>div.ph-id:first-child{gap:.75rem}}
main .card,main .tablebox,main .totals{box-shadow:0 1px 2px rgb(0 0 0 / .28)}
:root[data-theme="light"] main .card,:root[data-theme="light"] main .tablebox,:root[data-theme="light"] main .totals{box-shadow:0 1px 2px rgb(58 22 8 / .08)}
.page-head>div:first-child{display:flex;flex-direction:column;gap:.25rem}
.row{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
.spread{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:.75rem}

/* Buttons and fields */
.btn{font:inherit;font-weight:600;height:2.5rem;padding:0 1rem;display:inline-flex;align-items:center;justify-content:center;gap:.5rem;border-radius:6px;cursor:pointer;background:transparent;color:var(--text);border:1px solid var(--b-def);text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--subtle);color:var(--text)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover);color:var(--on-accent)}
.btn.quiet{color:var(--sec);border-color:var(--b-sub);padding:0 .75rem}
.btn.sm{height:2rem;padding:0 .75rem}
.btn.danger{border:0;color:var(--danger);padding:0 .75rem}
.wk-line{margin:0;padding-top:.625rem;border-top:1px solid var(--sep)}.wk-line a{white-space:nowrap}
.btn.ghost{border-color:var(--sep);color:var(--sec)}.btn.ghost:hover{border-color:var(--b-def)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn[aria-pressed="true"]{background:var(--accent-subtle);border-color:var(--accent-b);color:var(--accent-text)}
input,select,textarea{font:inherit;font-size:1rem;height:2.5rem;padding:0 .75rem;background:var(--base);color:var(--text);border:1px solid var(--field-b);border-radius:6px;min-width:0}
textarea{height:auto;padding:.5rem .75rem;resize:vertical;width:100%}
input[type=checkbox]{width:1.125rem;height:1.125rem;accent-color:var(--accent);margin:0;flex:none}
label.f{display:flex;flex-direction:column;gap:.25rem;color:var(--sec);min-width:0}
label.f.tiny{font-size:.75rem;line-height:1rem;color:var(--ter)}
label.f.tiny input,label.f.tiny select{font-size:.875rem}
label.check{display:flex;align-items:center;gap:.5rem;min-height:2.5rem;color:var(--sec);cursor:pointer}
.field-err{color:var(--danger);font-size:.75rem;line-height:1rem}
[aria-invalid="true"]{border-color:var(--danger)!important}
.seg{display:flex;width:fit-content;max-width:100%;gap:.25rem;padding:.25rem;background:var(--sunken);border:1px solid var(--sep);border-radius:10px;flex-wrap:wrap}
.seg button{font:inherit;font-weight:600;height:2rem;padding:0 .75rem;border:0;border-radius:6px;cursor:pointer;background:transparent;color:var(--sec)}
.seg button[aria-pressed="true"]{background:var(--raised);color:var(--text)}
.seg button span{font-weight:400;color:var(--ter)}

/* Surfaces */
.card{background:var(--raised);border:1px solid var(--sep);border-radius:10px;padding:1.25rem 1.5rem;display:flex;flex-direction:column;gap:.75rem;min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,21.25rem),1fr));gap:1rem}
.grid.sm{grid-template-columns:repeat(auto-fill,minmax(min(100%,16.25rem),1fr))}
.tag{display:inline-block;font-size:.75rem;line-height:1rem;font-weight:600;color:var(--sec);background:none;border:1px solid var(--sep);border-radius:6px;padding:0 .4375rem;white-space:nowrap}
.tag.info{color:var(--info-text);background:var(--info-subtle)}
.tag.gold{color:var(--accent-text);background:var(--accent-subtle)}
.dot{display:inline-block;width:.625rem;height:.625rem;border-radius:50%;flex:none}
/* Class icons, ringed in the class colour */
.cls-ic{display:inline-block;width:1.125rem;height:1.125rem;border-radius:4px;flex:none;vertical-align:middle;object-fit:cover;box-shadow:0 0 0 1px var(--cc,transparent);background:var(--sunken)}
.chip .cls-ic{width:1rem;height:1rem}
.empty{color:var(--ter);padding:.5rem 0}
.note{padding:.625rem .875rem;border:1px solid var(--b-sub);background:var(--sunken);border-radius:10px;color:var(--sec)}
.note.warn{border-color:var(--accent-b);color:var(--text)}
.linkish{font:inherit;font-weight:600;background:none;border:0;padding:0;color:var(--text);cursor:pointer;text-align:left;text-decoration:none}
a.linkish:hover,button.linkish:hover{color:var(--accent-text)}

/* Roster */
.roster-layout{display:grid;grid-template-columns:minmax(0,1fr) 20rem;gap:1.5rem;align-items:start}
.rl-col{display:flex;flex-direction:column;gap:1rem;min-width:0}
@media (max-width:980px){.roster-layout{grid-template-columns:minmax(0,1fr);gap:1rem}.rl-col{display:contents}.rl-col>*{order:var(--o,50)}}
.tablebox{background:var(--raised);border:1px solid var(--sep);border-radius:10px;container-type:inline-size;overflow:hidden}
@container (min-width:641px) and (max-width:780px){.roster-t th:nth-child(4),.roster-t td:nth-child(4){display:none}}
table{border-collapse:collapse;width:100%}
th{font-size:.75rem;line-height:1rem;font-weight:600;color:var(--ter);text-align:left;padding:.75rem 1rem;border-bottom:1px solid var(--sep);white-space:nowrap}
td{padding:.625rem 1rem;border-top:1px solid var(--sep);vertical-align:middle}
tbody tr:first-child td{border-top:0}
tr.alt td{background:var(--base)}
tr.alt td:first-child{padding-left:2rem}
td .l2{display:block;font-size:.75rem;line-height:1rem;color:var(--ter)}
@container (max-width:640px){
  table thead{display:none}
  table,tbody,tr,td{display:block}
  tbody tr{padding:.75rem 1rem;border-top:1px solid var(--sep)}
  tbody tr:first-child{border-top:0}
  tr.alt{padding-left:2rem}
  td,tr.alt td:first-child{border:0;padding:2px 0;display:flex;justify-content:space-between;gap:.75rem;background:transparent}
  tr.alt td{background:transparent}
  td::before{content:attr(data-label);color:var(--ter);font-size:.75rem;flex:none}
  td:first-child::before{content:none}
  .rd-t td:empty{display:none}
  td>*{text-align:right}
  td:first-child>*{text-align:left}
  /* The roster: two or three tight lines per person instead of a label for every value */
  .roster-t tbody tr{display:grid;grid-template-columns:minmax(0,1fr) auto 2rem;grid-template-areas:"name lv x" "prof prof x";gap:.25rem .75rem;padding:.625rem .5rem .625rem .875rem;align-items:center}
  .roster-t td:nth-child(4),.roster-t td:nth-child(5){display:none!important}
  .roster-t .l2{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .roster-t .r-profs{flex-direction:row!important;flex-wrap:wrap}
  .roster-t td:nth-child(6){grid-area:x;align-self:center}
  .roster-t tbody tr.r-more{display:block;padding:0}.roster-t tr.r-more>td{display:block;padding:.25rem .875rem 1rem}
  .roster-t tbody tr.r-group{display:block;padding:0}.roster-t tr.r-group>td{display:block;padding:.5rem .875rem}
  .roster-t td{display:block;padding:0;font-size:.875rem;line-height:1.125rem}
  .roster-t td::before{content:none}
  .roster-t td>*{text-align:left}
  .roster-t td:nth-child(1){grid-area:name;font-size:.875rem;line-height:1.25rem}
  .roster-t td:nth-child(2){grid-area:lv;justify-self:end}
  .roster-t td:nth-child(3){grid-area:prof}
  .roster-t td:nth-child(4){grid-area:loot}
  .roster-t td:nth-child(5){grid-area:seen;color:var(--ter);white-space:nowrap}
  .roster-t td:nth-child(5) .ter{color:inherit}
  .roster-t .seen-l{display:none}
  .roster-t td.none{display:none}
  .roster-t tr.alt{padding-left:1.75rem}
}

/* Professions */
.pbar{display:grid;grid-template-columns:minmax(0,9em) minmax(0,1fr) 4.5em;gap:.75rem;align-items:center}
.pbar .lbl{display:flex;flex-direction:column;min-width:0}
.pbar .lbl .r{font-size:.75rem;line-height:1rem;color:var(--ter)}
.track{height:.375rem;background:var(--sunken);border-radius:4px;position:relative;overflow:hidden}
.track i{position:absolute;left:0;top:0;bottom:0;background:var(--accent-text)}
.track i.max{background:var(--gold-hi)}
.track b{position:absolute;top:0;bottom:0;width:1px;background:var(--b-sub)}
.pbar .num{text-align:right;color:var(--ter);font-size:.75rem}
.pbar .num.max{color:var(--accent-text)}

/* Items and coins */
.item-plain{font-weight:600}
.item-link{font-weight:600;text-decoration:none;color:var(--accent-text);overflow-wrap:anywhere}
.item-ic{display:inline-block;width:1.125em;height:1.125em;margin-right:.3em;vertical-align:-.2em;border-radius:4px;background:var(--sunken);box-shadow:0 0 0 1px color-mix(in srgb,currentColor 45%,transparent);object-fit:cover}
.item-link.q0{color:var(--q0)!important}.item-link.q1{color:var(--q1)!important}.item-link.q2{color:var(--q2)!important}.item-link.q3{color:var(--q3)!important}.item-link.q4{color:var(--q4)!important}.item-link.q5{color:var(--q5)!important}.item-link.q6,.item-link.q7{color:var(--q6)!important}

/* Profile */
.profile{display:grid;grid-template-columns:minmax(0,1fr) 22.5rem;gap:1rem;align-items:start}
.profile>section,.profile>[data-sec],.profile .col>*{min-width:0}
@media (max-width:1000px){.profile{grid-template-columns:minmax(0,1fr) 20rem}}
.profile .col{display:flex;flex-direction:column;gap:1rem;min-width:0}
@media (max-width:900px){.profile{grid-template-columns:minmax(0,1fr)}.profile .col{display:contents}.profile .col>*{order:var(--o,50)}}
.journey{display:flex;flex-direction:column}
.journey div{display:flex;justify-content:space-between;gap:.75rem;padding:.5rem 0;border-top:1px solid var(--sep)}
.journey div:first-child{border-top:0}

/* Dialog */
dialog{border:1px solid var(--b-sub);border-radius:10px;background:var(--overlay);color:var(--text);padding:0;width:min(40rem,calc(100vw - 2rem));max-height:calc(100vh - 3rem);box-shadow:0 1px 2px rgb(0 0 0 / .27),0 4px 12px rgb(0 0 0 / .23)}
dialog::backdrop{background:var(--scrim)}
dialog form{padding:1.5rem;display:flex;flex-direction:column;gap:1.25rem}
dialog fieldset{border:0;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,11.25rem),1fr));gap:.75rem 1rem}
dialog legend{font-weight:600;font-size:1rem;line-height:1.5rem;padding:0 0 .5rem}
.dlg-actions{display:flex;flex-wrap:wrap;justify-content:space-between;gap:.5rem;padding-top:.5rem;border-top:1px solid var(--sep)}

/* Sign in */

/* Sync and offline notice floats in the corner so it never pushes the page around. */
.netbar{position:fixed;left:1rem;bottom:calc(1rem + env(safe-area-inset-bottom,0px));z-index:15;max-width:min(26.25rem,calc(100vw - 2rem));font-size:.75rem;line-height:1.125rem;padding:.5rem .75rem;border-radius:10px;border:1px solid var(--accent-b);background:var(--sunken);color:var(--text);box-shadow:0 4px 12px rgb(0 0 0 / .25);pointer-events:none}
.lg-card{width:16.25rem;height:23.75rem;border-radius:16px;padding:.375rem;box-shadow:0 6px 20px rgb(0 0 0 / .35);flex:none;box-sizing:border-box;position:relative;overflow:hidden}
/* Foil cards catch the light when you point at them (bronze a little, silver more, gold most). */
.lg-card.foil::after{content:"";position:absolute;top:0;bottom:0;left:-100%;width:100%;pointer-events:none;opacity:0;background:linear-gradient(105deg,transparent 20%,var(--shine) 50%,transparent 80%);mix-blend-mode:screen}
@media (hover:hover) and (pointer:fine){.lg-card.foil:hover::after{animation:lgShine .9s cubic-bezier(.23,1,.32,1) forwards}}
@keyframes lgShine{from{opacity:1;transform:translateX(0)}to{opacity:1;transform:translateX(200%)}}
@media (prefers-reduced-motion:reduce){.lg-card.foil:hover::after{animation:none}}
.lg-card-in{height:100%;border-radius:10px;background:#0f0a09;overflow:hidden;display:flex;flex-direction:column;position:relative;color:#efe6e2}
.lg-hd{display:flex;justify-content:space-between;align-items:baseline;gap:.5rem;padding:.5625rem .75rem .375rem}
.lg-nm{display:flex;align-items:center;min-width:0}
.lg-hd b{font-family:var(--display);font-weight:600;font-size:1.25rem;line-height:1.375rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.lg-hp{font-weight:600;font-size:.875rem;line-height:1.25rem;color:#ff7a6b;white-space:nowrap}.lg-hp small{font-size:.6875rem;font-weight:600;margin-right:2px}
.lg-art{height:9.375rem;margin:0 .625rem;border-radius:96px 96px 8px 8px;position:relative;overflow:hidden;flex:none;border:2px solid rgb(255 255 255 / .14);background:#0f0a09 center/cover}
.lg-art img.r{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 40%;transform:scale(1.35)}
.lg-face{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:4.75rem;height:4.75rem;border-radius:50%;background:#0f0a09;border:3px solid;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:600;font-size:2rem;overflow:hidden}

.lg-pvp{position:absolute;top:3.125rem;right:.5rem;width:2.25rem;z-index:1;display:flex;justify-content:center;filter:drop-shadow(0 1px 2px rgb(0 0 0 / .85))}
.lg-rank{position:absolute;left:.75rem;bottom:1.875rem;z-index:1;display:flex;align-items:center;gap:.25rem;font:600 .6875rem/1 var(--display);letter-spacing:.1em;text-transform:uppercase;color:#f6d77a;text-shadow:0 1px 3px rgb(0 0 0 / .9)}
.lg-rank>span{display:inline-flex;width:.8125rem;height:.8125rem}.lg-rank svg{width:100%;height:100%}
.lg-art.has-move .lg-rank{bottom:2.4375rem}
.lg-art.is-gm .lg-hd b{color:#f6d77a}
.title-pick{display:flex;flex-direction:column;align-items:center;gap:.5rem;width:100%}
.tp-row{display:flex;flex-wrap:wrap;justify-content:center;gap:.75rem}
.tp-sw{width:3.5rem;height:4.5rem;box-sizing:border-box;border:0;border-radius:10px;padding:0 0 .375rem;display:flex;align-items:flex-end;justify-content:center;cursor:pointer;box-shadow:inset 0 0 0 2px rgb(15 10 9 / .45)}
.tp-sw span{font:600 .6875rem/1 var(--display);letter-spacing:.06em;text-transform:uppercase;color:#fff;text-shadow:0 1px 2px rgb(0 0 0 / .9);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 .125rem}
.tp-sw[aria-pressed="true"]{outline:3px solid var(--accent-text);outline-offset:2px}
.tp-sw:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
.tp-sw:hover{filter:brightness(1.12)}
/* Card back: nothing may run past the card */
.lg-back .lg-card-in{overflow:hidden}
.lg-clip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lg-back .lg-br span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.zm-week{display:flex;align-items:center;gap:.75rem}
.zm-play{all:unset;box-sizing:border-box;cursor:pointer;width:2.25rem;height:2.25rem;border-radius:50%;background:var(--accent);display:grid;place-items:center;flex:none}
.zm-play:hover{background:var(--accent-hover)}.zm-play:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

.zm-play .st{width:.6875rem;height:.6875rem;background:var(--on-accent);border-radius:4px}
.zm-days{flex:1;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:.25rem}
.zm-day{all:unset;box-sizing:border-box;cursor:pointer;text-align:center;font:600 .75rem Figtree,system-ui,sans-serif;color:var(--sec);padding:.375rem 0 .3125rem;border-radius:6px;background:var(--sunken);display:flex;flex-direction:column;align-items:center;gap:.25rem}
.zm-day em{display:block;height:4px;border-radius:4px;background:var(--zm-4);min-width:0}

.zm-daycap{position:absolute;left:.75rem;top:.75rem;background:color-mix(in srgb,var(--raised) 88%,transparent);border:1px solid var(--sep);border-radius:10px;padding:.375rem .625rem;display:flex;flex-direction:column;max-width:calc(100% - 1.5rem);pointer-events:none}
.zm-daycap b{color:var(--accent-text)}
/* Levelling timeline */
.lv-gap{stroke-dasharray:4 5;opacity:.7}
.lv-stats{display:flex;gap:1.5rem;flex-wrap:wrap}.lv-stats div{display:flex;flex-direction:column}.lv-stats b{font-size:1.25rem;color:var(--ginger);font-variant-numeric:tabular-nums}.lv-stats span{font-size:.75rem;color:var(--ter)}
.lv-svg{display:block;width:100%;height:auto;overflow:visible}
.lv-g{stroke:var(--sep)}.lv-ax{font:500 10px Figtree,system-ui,sans-serif;fill:var(--ter)}
.lv-l1{fill:none;stroke:var(--accent-text);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.lv-l2{fill:none;stroke:var(--ter);stroke-width:1.6;stroke-dasharray:4 3;stroke-linejoin:round}
.lv-mk{fill:var(--raised);stroke:var(--accent-text);stroke-width:2}.lv-now{fill:var(--accent-text);stroke:var(--raised);stroke-width:2}

.lv-key{display:flex;gap:1rem;flex-wrap:wrap;color:var(--ter);align-items:center}.lv-key i{display:inline-block;width:1.125rem;vertical-align:middle;margin-right:.375rem}
.lv-key .k1{border-top:2.5px solid var(--accent-text)}.lv-key .k2{border-top:1.6px dashed var(--ter)}.lv-key .k3{height:.625rem;background:color-mix(in srgb,var(--accent) 22%,transparent);border-radius:4px}
.lv-cmp select{max-width:12rem}
/* Anniversaries and What's new */
.anniv{font-size:.875rem;line-height:1;cursor:default}
.bday-banner{flex-direction:row!important;align-items:center;gap:1rem;background:radial-gradient(ellipse at 12% 50%,color-mix(in srgb,var(--accent) 22%,transparent),transparent 60%),var(--raised)!important;border-color:color-mix(in srgb,var(--accent) 40%,var(--sep))!important}
.bday-banner b{display:block;font-size:1.25rem}
.wn-btn{position:relative}.wn-ic{font-size:.875rem;color:var(--gold-hi)}
.wn-pip{position:absolute;top:.25rem;right:.25rem;width:.5rem;height:.5rem;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.wn-l{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wn{display:flex;flex-direction:column;gap:.75rem;width:min(36rem,calc(100vw - 3rem))}
.wn-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;max-height:min(60vh,32rem);overflow:auto}
.wn-list li{display:grid;grid-template-columns:3.75rem minmax(0,1fr);gap:.75rem;padding:.625rem 0;border-top:1px solid var(--sep)}.wn-list li:first-child{border-top:0}
.wn-list time{font-size:.75rem;color:var(--ter);padding-top:.125rem}.wn-list p{margin:.125rem 0 0;font-size:.875rem;color:var(--sec);line-height:1.45}
.wn-list a{font-size:.75rem;font-weight:600;color:var(--accent-text)}
.wn-tag{font:600 .6875rem Figtree,system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase;background:var(--gold-hi);color:#1a1110;border-radius:4px;padding:.125rem .3125rem;margin-left:.375rem;vertical-align:.125rem}
/* Where the Guild Plays: our own drawn maps of Kalimdor and the Eastern Kingdoms, zones shaded by guild hours */
:root{--zm-sea:#0c151a;--zm-hatch:#16252d;--zm-glow:#4d6a72;--zm-shore:#7d9aa0;--zm-land:#2b211d;--zm-coast:#a3784a;--zm-edge:#5b3a24;--zm-border:#120b0a;
  --zm-1:#4a1a1f;--zm-2:#6e1a25;--zm-3:#8f1530;--zm-4:#b3123a;--zm-5:#cf2846;--zm-lake:#1d313a;--zm-paper:.45;--zm-lab0:#a89490;--zm-lab:#f6e7da;--zm-halo:#0f0a09;--zm-city:#f0c58c}
:root[data-theme="light"]{--zm-sea:#dde7e9;--zm-hatch:#c9d8dc;--zm-glow:#9fb8bf;--zm-shore:#ffffff;--zm-land:#efe3d0;--zm-coast:#8a6440;--zm-edge:#a07a52;--zm-border:#8a6a4c;
  --zm-lake:#c4d8dd;--zm-paper:.16;--zm-1:#f2cfc9;--zm-2:#e6a3a3;--zm-3:#cf6470;--zm-4:#b02a40;--zm-5:#8a0d25;--zm-lab0:#6f605a;--zm-lab:#2a1d1a;--zm-halo:#fbf7f2;--zm-city:#7a4a1c}
.zm{display:grid;grid-template-columns:minmax(0,26rem) minmax(0,1fr);gap:1.25rem;align-items:start}
.zm-map{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--sep);background:var(--zm-sea)}
.zm-svg{display:block;width:100%;height:auto}
.zm-z{cursor:pointer;fill:var(--zm-land);stroke:var(--zm-border);stroke-width:1.1;stroke-linejoin:round;transition:filter .15s}
.zm-z:hover{filter:brightness(1.18)}
.zm-z.l1{fill:var(--zm-1)}.zm-z.l2{fill:var(--zm-2)}.zm-z.l3{fill:var(--zm-3)}.zm-z.l4{fill:var(--zm-4)}.zm-z.l5{fill:var(--zm-5)}
.zm-sel{fill:none;stroke:var(--gold-hi);stroke-width:2.4;stroke-linejoin:round;pointer-events:none}
.zm-t{font:600 calc(9px*var(--zk,1)) Figtree,system-ui,sans-serif;text-anchor:middle;paint-order:stroke;stroke:var(--zm-halo);stroke-width:2.5px;fill:var(--zm-lab0);pointer-events:none}
.zm-t.on{fill:var(--zm-lab)}:root:not([data-theme="light"]) .zm-t.on{fill:#f6e7da}
:root[data-theme="light"] .zm-t.hot{fill:#fff;stroke:#5a0716}
.zm-t.h{font-size:calc(8px*var(--zk,1));fill:var(--accent-text)}:root[data-theme="light"] .zm-t.h.hot{fill:#ffe9c9}
.zm-t.x{font-size:calc(7px*var(--zk,1));font-style:italic}
.zm-c{cursor:pointer;fill:var(--zm-city);stroke:var(--zm-halo);stroke-width:2}
.zm-c.sel{stroke:var(--gold-hi);stroke-width:3}
.zm-t.c{fill:var(--zm-city);font-size:calc(8.5px*var(--zk,1))}
/* The World view is drawn smaller, so its text is scaled up to stay readable */
.zm-svg.w{--zk:1.25}
.zm-side{display:flex;flex-direction:column;gap:1rem;min-width:0}
.zm-top{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.zm-top li{border-top:1px solid var(--sep)}.zm-top li:first-child{border-top:0}
.zm-top button{all:unset;box-sizing:border-box;width:100%;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.25rem .75rem;padding:.5rem .25rem;border-radius:6px}
.zm-top button:hover{background:var(--subtle)}.zm-top button:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.zm-top button[aria-pressed="true"] b{color:var(--accent-text)}
.zm-bar{grid-column:1/-1;height:5px;border-radius:4px;background:var(--sunken);overflow:hidden}.zm-bar i{display:block;height:100%;background:var(--ginger)}
.zm-who{display:flex;flex-wrap:wrap;gap:.375rem .75rem}
.zm-key{display:flex;flex-wrap:wrap;align-items:center;gap:.25rem;font-size:.75rem;color:var(--ter)}
.zm-key i{width:1.25rem;height:.625rem;border-radius:4px;display:inline-block;border:1px solid var(--sep)}
@media (max-width:900px){.zm{grid-template-columns:minmax(0,1fr)}.zm:not(.world) .zm-map{max-width:30rem;margin:0 auto;width:100%}}
.zm.world{grid-template-columns:minmax(0,1fr) minmax(0,19rem)}
@media (max-width:1100px){.zm.world{grid-template-columns:minmax(0,1fr)}.zm.world .zm-side{display:grid;grid-template-columns:repeat(auto-fit,minmax(16rem,1fr));align-items:start}.zm.world .zm-side>p{grid-column:1/-1}}
.zm-card{gap:.5rem;padding:.875rem 1rem}.zm-card h3{margin:0;font-size:1rem;display:flex;align-items:center;gap:.375rem}
.zm-dgl .zm-top{display:grid;grid-template-columns:repeat(auto-fill,minmax(15rem,1fr));column-gap:1.25rem}.zm-dgl .zm-top li:nth-child(2){border-top:0}
@media (max-width:640px){.zm-dgl .zm-top li:nth-child(2){border-top:1px solid var(--sep)}}
.zm-nm{display:flex;align-items:center;gap:.5rem;min-width:0;flex-wrap:wrap}
.zm-detail{margin:0;border-left:2px solid var(--accent-text);padding:.125rem 0 .125rem .75rem;display:flex;flex-direction:column;gap:.375rem}
.zm-dg path{cursor:pointer;fill:var(--zm-city);stroke:var(--zm-halo);stroke-width:1.6;stroke-linejoin:round}
.zm-dg.badge.off path{fill:var(--zm-halo);opacity:.9}
.zm-dg.off path{fill:var(--zm-land);stroke:var(--zm-city);stroke-width:1.2;opacity:.6}.zm-dg.off:hover path{opacity:1}
.zm-dg:hover path{fill:var(--gold-hi)}.zm-dg.sel path{stroke:var(--gold-hi);stroke-width:2.6}

.zm-dgi{display:inline-block;width:.625rem;height:.625rem;transform:rotate(45deg);background:var(--zm-city);border:1px solid var(--zm-halo);flex:none}
.zm-sea-t{font:italic 600 11px Figtree,system-ui,sans-serif;letter-spacing:.3em;text-anchor:middle;fill:var(--zm-shore);opacity:.45;pointer-events:none}

/* Guild scribe: when the guild plays, raid nights, recipes known */
.wwp{display:grid;grid-template-columns:2.25rem repeat(24,minmax(0,1fr));gap:.125rem;align-items:center}
.wwp-h{font-size:.6875rem;line-height:.875rem;color:var(--ter);white-space:nowrap;overflow:visible}
.wwp-d{font-size:.75rem;color:var(--sec);font-weight:600}
.wwp-c{display:block;height:1.125rem;border-radius:4px;background:color-mix(in srgb,var(--accent) calc(var(--a,0)*100%),var(--subtle))}
.wwp-c.none{background:transparent;box-shadow:inset 0 0 0 1px var(--sep)}
.rn{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.75rem}
.rn li{display:grid;grid-template-columns:minmax(0,12rem) minmax(0,1fr);gap:.5rem 1rem;align-items:start;padding-top:.625rem;border-top:1px solid var(--sep)}
.rn li:first-child{border-top:0;padding-top:0}
.rn-when{display:flex;flex-direction:column}
.rn-who{display:flex;flex-wrap:wrap;gap:.375rem}
@media (max-width:640px){.rn li{grid-template-columns:minmax(0,1fr)}.wwp{grid-template-columns:1.75rem repeat(24,minmax(0,1fr));gap:.0625rem}.wwp-c{height:.875rem}}
.rc-knows{font-size:.75rem;font-weight:600;color:var(--trim)}
:root[data-theme="light"] .rc-knows{color:#1d6b30}
/* The loading screen: the gingerbread badge spins (or gently pulses, for anyone who's asked for less motion) until the
   roster arrives, then fades away. */
/* The site search: a button in the header and a dialog of results */
.srch-btn{display:inline-flex;align-items:center;gap:.375rem}.srch-ic{display:inline-flex;flex:none}
.srch-k{font:600 .6875rem/1 inherit;font-family:inherit;padding:.125rem .375rem;border:1px solid var(--b-def);border-radius:4px;color:var(--ter)}
@media (max-width:900px){.srch-k{display:none}}@media (max-width:640px){.srch-l{display:none}}
dialog.srch-dlg{width:min(36rem,calc(100vw - 2rem));margin-top:12vh}
dialog.srch-dlg form{padding:1rem;gap:.5rem}
.srch-box{display:flex;align-items:center;gap:.5rem;padding:0 .75rem;border:1px solid var(--b-def);border-radius:10px;background:var(--sunken);color:var(--ter)}
.srch-box:focus-within{border-color:var(--focus)}
.srch-in{flex:1;min-width:0;height:3rem;border:0;background:none;color:var(--text);font:inherit;font-size:1rem;outline:none}
.srch-hint{margin:.25rem .25rem 0}.srch-hint:empty{display:none}
.srch-list{list-style:none;margin:0;padding:0;max-height:min(26rem,55vh);overflow:auto;display:flex;flex-direction:column;gap:.125rem}
.srch-o{display:flex;align-items:center;gap:.75rem;padding:.5rem .625rem;border-radius:10px;cursor:pointer;min-height:2.75rem;box-sizing:border-box}
.srch-o[aria-selected="true"]{background:var(--subtle);box-shadow:inset 3px 0 0 var(--accent-text)}
.srch-t{flex:none;width:4.75rem;font-size:.6875rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ter)}
.srch-main{display:flex;flex-direction:column;min-width:0}.srch-main b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.srch-main .small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srch-main b.q2{color:var(--q2,#1eff00)}.srch-main b.q3{color:var(--q3,#3b9cff)}.srch-main b.q4{color:var(--q4,#c06bff)}
#boot{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;background:var(--base);color:var(--ter);font-size:.875rem;transition:opacity .35s ease,visibility .35s}

@keyframes gb-spin{0%{transform:rotate(0) scale(1)}45%{transform:rotate(200deg) scale(1.06)}100%{transform:rotate(360deg) scale(1)}}
@media (prefers-reduced-motion:reduce){.boot-gb{animation:gb-pulse 1.8s ease-in-out infinite}@keyframes gb-pulse{50%{opacity:.55}}#boot{transition:none}}
/* Pictures fade in the first time they load, and a box keeps their space so nothing jumps. */
img.fade{opacity:0;transition:opacity .3s ease}img.fade.in{opacity:1}
@media (prefers-reduced-motion:reduce){img.fade{transition:none}}
/* Opening something slides it down into place (only when it's opened, not on every redraw). */

.opening:not(details),details.opening>:not(summary){animation:slide-open .24s cubic-bezier(.2,.7,.3,1)}
@media (prefers-reduced-motion:reduce){.opening:not(details),details.opening>:not(summary){animation:none}}

/* Option B: quieter details on top of the tidy-up */
nav.main a[aria-current="page"]{background:transparent;box-shadow:inset 0 -2px 0 var(--accent)}
.r-av{border-width:1.5px;font:600 .75rem/1 var(--body);letter-spacing:.02em}

@media (min-width:701px){.roster-t td{padding-top:.75rem;padding-bottom:.75rem}}
main .card,main .tablebox,main .totals{border-color:color-mix(in srgb,var(--sep) 70%,transparent)}
.btn{border-color:color-mix(in srgb,var(--b-def) 70%,transparent)}
.total b{font-weight:600}

.roster-layout .tablebox{background:none;border:0;border-radius:0;overflow:visible}

.now-av{position:relative;width:3rem;height:3rem;border-radius:50%;display:grid;place-items:center;font:600 .875rem/1 var(--display);background:color-mix(in srgb,var(--cc) 14%,var(--sunken));box-shadow:0 0 0 2px var(--raised),0 0 0 3.5px var(--cc);margin-bottom:.25rem;transition:transform .15s}

.spot-lv{position:absolute;left:0;right:0;bottom:0;height:3px;border-radius:999px;background:color-mix(in srgb,var(--sep) 70%,transparent);overflow:hidden}

/* Cards: tip toward the pointer and catch the light */

  return have}
const RACES=["Orc","Troll","Tauren","Undead","Skyborne"];

const GATHERING=["Herbalism","Mining","Skinning"];
const SECONDARY=["Cooking","First Aid","Fishing"];
const CLASS_SKILLS={Lockpicking:"Rogue",Comprehension:"Mage"};
// Class skills (Lockpicking, Comprehension) aren't on the armory, so they were dropped from the site. Old ones are hidden when loaded.
const RANKS=[[75,"Apprentice"],[150,"Journeyman"],[225,"Expert"],[300,"Artisan"]];

// From Warcraft Tavern's WoW Forever dungeon list, in level order.
